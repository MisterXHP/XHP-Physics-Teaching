<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>交互动画 · 重力场分布</title>
<link rel="stylesheet" href="katex/katex.min.css">
<style>
  /* ===== 主题变量 =====
     深色写在 :root（默认），浅色整组覆盖在 body.light 上。
     ★ 这里只管 DOM；canvas 不认 CSS 变量，必须另配一套调色板（见脚本里的 THEMES）。 */
  :root{
    --bg1:#0d1526;  --bg2:#0a101c;
    --card:#141d2f; --card2:#0f1726;
    --line:#263349; --text:#e8eef8; --text2:#96a7c0;
    --accent:#4d8dff; --accentHov:#3f7ff0;
    --btn:#1b2740; --btnline:#2c3a55;
    --track:#2a3752; --bar:#233047;
    --dash:#d7e3f6; --dd:#b6c5da;
    /* 强调按钮（地球自转 / 停止自转）：粉红 —— 全页只此一个 */
    --demo:#ec4899; --demoHov:#db2777;
    /* 视角预设按钮的「选中」淡底（蓝系，与粉红主按钮分工：粉色=动作，蓝色=状态） */
    --onbg:rgba(77,141,255,.16);
    --probe:#ff5f9e;
    --shadow:0 8px 26px rgba(0,0,0,.38);
    --radius:16px;
  }
  body.light{
    --bg1:#eef2f6;  --bg2:#e3eaf1;
    --card:#ffffff; --card2:#f7fafc;
    --line:#dde3ea; --text:#202730; --text2:#5b6672;
    --accent:#185fa5; --accentHov:#0e4f8f;
    --btn:#ffffff; --btnline:#c9d2dc;
    --track:#d5dce4; --bar:#e6ebf1;
    --dash:#1f2733; --dd:#3d4855;
    --demo:#db2777; --demoHov:#be185d;
    --onbg:rgba(24,95,165,.10);
    --probe:#d6316f;
    --shadow:0 6px 20px rgba(20,32,54,.10);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 100%);
    background-attachment:fixed;
    color:var(--text);
    font-family:"Times New Roman",Times,"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,-apple-system,"Segoe UI",sans-serif;
    font-size:17px;
    padding:14px 20px 14px;
  }
  .wrap{width:100%;max-width:1800px;margin:0 auto;}

  header.top{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:12px;}
  header.top .titles{min-width:0;}
  header.top h1{font-size:30px;margin:0;letter-spacing:1px;font-weight:700;}
  header.top .sub{margin:6px 0 0;color:var(--text2);font-size:16px;line-height:1.6;}
  /* 页头两个按钮共用同一字号：@media(max-height:940px) 的 .btn 只作用于 .btn，
     靠 id 特异性把两者一起钉住，才能保证同高 */
  #themeBtn,#fsBtn{white-space:nowrap;font-size:15.5px;}

  /* 底部：作者 / 版本（公开版不显示单位），同字重同颜色 */
  .foot{margin:16px 0 0;padding-top:10px;border-top:1px solid var(--line);
        text-align:center;font-size:15px;color:var(--text2);line-height:1.8;}
  .foot .sep{margin:0 16px;color:var(--line);}

  /* 左栏整列只有画布；右栏两行：控制（auto）+ 数据（1fr）。右栏宽度用 px 夹逼，
     把能省的宽度全给动画区（1920 下画布从 1201 宽涨到 ~1425）。 */
  .cols{display:grid;grid-template-columns:minmax(0,1fr) clamp(336px,18.8vw,372px);gap:14px;align-items:stretch;}
  .col-left{display:flex;flex-direction:column;min-width:0;min-height:0;}
  .col-right{display:grid;grid-template-rows:auto minmax(0,1fr);gap:14px;
             min-width:0;min-height:0;overflow:hidden;}
  /* 关键：右栏绝不能把 grid 行高撑起来 —— 撑高了 fitViewport 削画布就失效、页面永久滚动条 */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);}

  /* 动画区是主角：左栏整列都是它 */
  .stage{padding:10px;flex:1;min-height:0;display:flex;flex-direction:column;}
  canvas{display:block;width:100%;border-radius:12px;}
  #cv{flex:1 1 auto;min-height:0;cursor:crosshair;touch-action:none;}

  /* ===== 右栏第一行：控制卡（窄栏 ⇒ 滑块独占一行，四个按钮 2×2） ===== */
  .controls{padding:12px 16px 13px;}
  .ctrl-head{display:flex;align-items:baseline;gap:10px;margin-bottom:6px;}
  .ctrl-head .t1{font-weight:700;font-size:19px;}

  .params{display:grid;grid-template-columns:1fr;gap:0;margin-top:2px;}
  .prow{display:grid;grid-template-columns:1fr auto;grid-template-areas:"lab val" "sld sld";
        align-items:center;gap:0 9px;padding:2px 0;}
  .prow .pl{grid-area:lab;font-size:17px;color:var(--text2);white-space:nowrap;}
  .prow .pv{grid-area:val;font-size:17px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .prow input[type=range]{grid-area:sld;width:100%;height:26px;}
  input[type=range]{-webkit-appearance:none;appearance:none;height:30px;background:transparent;margin:0;}
  input[type=range]::-webkit-slider-runnable-track{height:7px;border-radius:4px;background:var(--track);}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;
    background:#fff;border:3px solid var(--accent);margin-top:-9px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.45);}
  input[type=range]::-moz-range-track{height:7px;border-radius:4px;background:var(--track);}
  input[type=range]::-moz-range-thumb{width:19px;height:19px;border-radius:50%;background:#fff;border:3px solid var(--accent);cursor:pointer;}
  input[type=range]:disabled{opacity:.4;}

  .tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;}
  .tools .btn{padding:8px 4px;font-size:16px;text-align:center;}
  .btn{border:1px solid var(--btnline);background:var(--btn);color:var(--text);
       padding:9px 18px;border-radius:10px;font-size:17px;cursor:pointer;transition:.18s;}
  .btn:hover{border-color:var(--accent);color:var(--accent);}
  .btn.demo{background:var(--demo);border-color:var(--demo);color:#fff;box-shadow:0 3px 13px rgba(219,39,119,.30);}
  .btn.demo:hover{background:var(--demoHov);border-color:var(--demoHov);color:#fff;}
  /* 视角预设按钮的「当前选中」态。必须写在 .btn:hover 之后：两者特异性相同(0,2,0)，靠顺序取胜 */
  .btn.on{border-color:var(--accent);color:var(--accent);background:var(--onbg);}
  .btn.on:hover{border-color:var(--accentHov);color:var(--accentHov);}
  /* 截面视角下自转被强制停止：按钮置灰、不可点（不给一个点了没反应的开关） */
  .btn:disabled{opacity:.42;cursor:not-allowed;pointer-events:none;box-shadow:none;}
  /* 赤道截面下纬度被锁在 0：调了也是白调，干脆置灰 */
  .prow.lock{opacity:.45;}
  .prow.lock input{cursor:not-allowed;}

  /* ===== 右栏第二行：实时数据卡 =====
     高度是硬约束：卡片高度 = 左栏画布高 − 控制卡高 − 间隔。内容超出会把 grid 行撑高、
     让 fitViewport 削画布失效、页面出现永久滚动条 —— 所以字号一律用 vh 夹逼。
     排布：顶部 g 行紧凑 → 对照表吃掉全部余量 → 公式钉在卡底。
     （V1.5 用 space-between 把四块拉平，1080p 上就是用户说的「右栏太空」。） */
  /* gap 收一档（原 clamp(4px,1.05vh,13px)）：配合上面 .rd-tr 的让步，给放大后的字号腾高度 */
  .info{padding:12px 15px 12px;display:flex;flex-direction:column;
        justify-content:flex-start;gap:clamp(2px,.85vh,11px);overflow:hidden;}
  /* 除对照表外一律不许被压缩：flex 子项默认 flex-shrink:1，一挤就会让孩子溢出父盒、
     画到邻居身上（1366 上曾出现「地表重力」两行叠字）。 */
  .info>*{flex:0 0 auto;}
  /* 字号档位与光电门动画对齐（教室后排可读）：右栏任何一项都不低于 15px。 */
  .rd-h{margin:0;font-size:clamp(15px,1.95vh,20px);font-weight:700;color:var(--text2);
        letter-spacing:.10em;line-height:1.2;}
  .rd-k{font-size:clamp(15px,1.9vh,18px);color:var(--text2);line-height:1.35;}
  .rd-k i,.rd-sub i{font-style:italic;}

  .rd-v{font-size:clamp(24px,3.8vh,48px);font-weight:700;line-height:1.12;
        font-variant-numeric:tabular-nums;letter-spacing:.4px;}
  .rd-sub{font-size:clamp(15px,1.8vh,17px);color:var(--text2);}
  .rd-meta{display:flex;align-items:baseline;gap:0;margin-top:-2px;}
  .rd-meta .dot{margin:0 7px;color:var(--text2);opacity:.5;}

  /* g：全卡最显眼的一行 */
  .rd-g{display:flex;align-items:center;justify-content:space-between;gap:10px;
        padding:clamp(6px,1.1vh,14px) clamp(10px,1.1vw,16px);border-radius:10px;
        background:var(--onbg);border:1px solid var(--line);}
  .rd-g .rd-v{color:var(--accent);font-size:clamp(28px,4.9vh,62px);}

  /* r ↔ GM/r² 对照表（表体由 JS 按 SHELL_R 生成，不再硬编码副本）
     这一块是唯一的弹性块：多余高度全部由行距吸收，不会空出一大片 */
  .rd-tbl{flex:1 1 auto;display:flex;flex-direction:column;
          justify-content:space-evenly;min-height:0;overflow:hidden;}
  .rd-tr{flex:0 0 auto;}
  /* padding 收一档（原 clamp(3px,.62vh,7px)）：字号抬到 16~21px 后行高变高，
     行距让出来的高度正好补回表格，5 行合计省约 13px，1366×768 才不会裁掉末行。 */
  .rd-tr{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
         padding:clamp(1px,.42vh,5px) 0;border-bottom:1px solid var(--line);
         font-size:clamp(16px,2.05vh,21px);font-variant-numeric:tabular-nums;line-height:1.3;}
  .rd-tr>span:last-child{font-weight:700;text-align:right;}
  .rd-tr.hd{border-bottom-color:var(--text2);color:var(--text2);
            font-size:clamp(15px,1.85vh,18px);}
  .rd-tr.hd>span:last-child{font-weight:400;}
  .rd-surf{display:flex;flex-direction:column;gap:0;
           padding-top:6px;border-top:1px solid var(--line);}
  .rd-tbl .rd-tr:last-child{border-bottom:none;}
  .rd-surf .rd-tr:last-child{border-bottom:none;}
  .rd-surf .rd-tr>span:last-child{color:var(--probe);}

  /* 公式：单列（右栏只有 ~340px，双列必然把公式压到隔壁格）；margin-top:auto 钉在卡底 */
  .formulas{padding-top:10px;border-top:1px dashed var(--line);margin-top:auto;
            display:grid;grid-template-columns:1fr;gap:clamp(2px,.8vh,10px);}
  .formulas .frow{display:flex;align-items:center;gap:10px;color:var(--text);
                  min-height:clamp(40px,5.4vh,62px);}
  .formulas .fl{flex:0 0 74px;color:var(--text2);font-size:clamp(15px,1.85vh,17.5px);}
  .formulas .fx{flex:1;min-width:0;white-space:nowrap;}
  .katex{font-size:clamp(18px,2.45vh,25px);}

  /* 公式兜底：没装成 KaTeX（或只拷走 .html 没带 katex/）时，用 CSS 手排出 LaTeX 的样子。
     必须是 inline-block 而不是 flex —— flex 会把词间的空白文本节点丢掉，公式挤成 g=GM/r²。 */
  .mfb{display:inline-block;white-space:nowrap;
       font-family:"Times New Roman",Times,"PingFang SC","Microsoft YaHei",serif;
       font-size:clamp(18px,2.45vh,25px);line-height:1.4;}
  .mfb i{font-style:italic;padding:0 .02em;}
  .mfb sup{font-size:.68em;line-height:0;vertical-align:.46em;}
  .mfb .fr{display:inline-flex;flex-direction:column;align-items:center;
           vertical-align:middle;line-height:1.04;margin:0 .18em;}
  .mfb .fr>span:first-child{border-bottom:1.3px solid currentColor;padding:0 .26em .05em;}
  .mfb .fr>span:last-child{padding:.05em .26em 0;}
  .fx.katexed .mfb{display:none;}

  /* 手机 / 平板提示：桌面端隐藏 */
  .pchint{display:none;margin:12px 0 0;text-align:center;font-size:15px;color:var(--text2);}
  .pchint .pc-s{display:none;}
  @media (max-width:880px){ .pchint{display:block;} }
  @media (max-width:389px){ .pchint .pc-s{display:inline;} .pchint .pc-l{display:none;} }

  /* 窄屏堆叠：画布 → 控制 → 数据。堆叠时右栏是普通纵向 flex，不该再裁切内容 */
  @media (max-width:1000px){
    .cols{grid-template-columns:1fr;}
    .col-left{order:1;} .col-right{order:2;}
    .col-right{display:flex;flex-direction:column;overflow:visible;}
    .info{overflow:visible;}
  }
  /* 矮屏紧凑模式（1600×900 及以下）：整页以「一屏放下」为目标。
     数据卡在 900 高时可用约 507px，按常规行距要 ~520px ⇒ 必须压一道；
     原则是压行距与间距，不把字号压到 12.5px 以下，也不藏公式（那是教学内容）。 */
  @media (max-height:940px){
    header.top .sub{display:none;}
    header.top{margin-bottom:8px;}
    .info{padding:10px 13px 9px;gap:3px;}
    .rd-g{padding:5px 10px;}
    .rd-tr{padding:2px 0;}
    .formulas{padding-top:6px;}
    .formulas .frow{min-height:36px;}
    .katex,.mfb{font-size:18px;}
    .controls{padding:9px 13px 10px;}
    .tools{margin-top:9px;}
    .btn{padding:7px 15px;font-size:16px;}
  }
  /* 768 高（1366×768 / 1024×768）是最紧的一档：数据卡只有 ~377px。
     字号已经被抬到 15px 起，这里改为压「行距与间距」把它们腾出来，
     不再靠缩字号换空间。 */
  @media (max-height:820px){
    .info{padding:7px 13px 6px;gap:2px;}
    .rd-g{padding:2px 10px;}
    .rd-tr{padding:.5px 0;}
    .rd-surf{padding-top:2px;}
    .formulas{padding-top:2px;}
    .formulas .frow{min-height:30px;}
    /* 控制卡让位：它矮 1px，数据卡就高 1px，比压数据字号划算 */
    .ctrl-head{margin-bottom:5px;}
    .ctrl-head .t1{font-size:19px;}
    .tools{margin-top:8px;}
    .btn{padding:6px 15px;}
    .prow input[type=range]{height:24px;}
  }
  @media (max-width:860px){
    header.top{align-items:flex-start;}
  }
  @media (max-width:760px){
    body{padding:12px 12px 14px;}
    header.top h1{font-size:23px;letter-spacing:.5px;}
    header.top .sub{font-size:15px;}
    .info{padding:14px 16px 16px;}
  }

  /* ===== 页头右侧按钮组：主题 + 全屏 =====
     flex:0 0 auto + nowrap：整组不缩不拆行，宽度不够时由 header 的 flex-wrap 整组换行；
     两按钮同为 .btn ⇒ padding/圆角/字号同源，天然同高；
     [hidden] 必须显式覆盖：作者样式的 display 会盖掉 UA 的 [hidden]{display:none} */
  .hdr-tools{display:flex;align-items:stretch;gap:8px;flex:0 0 auto;flex-wrap:nowrap;}
  .hdr-tools .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;}
  .hdr-tools .btn svg{width:16px;height:16px;flex:none;}
  .hdr-tools .btn[hidden]{display:none;}
  .hdr-tools .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .hdr-tools #fsBtn .ico-in{display:none;}
  .hdr-tools #fsBtn[aria-pressed="true"] .ico-out{display:none;}
  .hdr-tools #fsBtn[aria-pressed="true"] .ico-in{display:block;}
  .hdr-tools #fsBtn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);}
  /* 窄屏：先收内边距，再窄就只留箭头（主题按钮文字必须保留） */
  @media (max-width:420px){
    .hdr-tools{gap:6px;}
    .hdr-tools .btn{padding-left:11px;padding-right:11px;}
  }
  @media (max-width:360px){
    .hdr-tools #fsBtn .lbl{display:none;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="titles">
      <h1>重力场分布</h1>
      <p class="sub">三维球形地球 —— 看清重力场随高度、纬度的变化；可拖动旋转、滚轮缩放</p>
    </div>
    <div class="hdr-tools">
      <button class="btn" id="themeBtn" type="button" title="切换深浅主题">🌙 深色模式</button>
      <button class="btn" id="fsBtn" type="button" aria-pressed="false" title="全屏显示">
        <svg class="ico-out" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="M9 4H5a1 1 0 0 0-1 1v4"/><path d="M15 4h4a1 1 0 0 1 1 1v4"/>
          <path d="M20 15v4a1 1 0 0 1-1 1h-4"/><path d="M4 15v4a1 1 0 0 0 1 1h4"/>
        </svg>
        <svg class="ico-in" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="M4 9V5a1 1 0 0 1 1-1h4"/><path d="M20 9V5a1 1 0 0 0-1-1h-4"/>
          <path d="M15 20h4a1 1 0 0 0 1-1v-4"/><path d="M9 20H5a1 1 0 0 1-1-1v-4"/>
        </svg>
        <span class="lbl">全屏</span>
      </button>
    </div>
  </header>

  <div class="cols">
    <!-- 左栏：整列只有动画区 -->
    <div class="col-left">
      <section class="card stage" id="stage">
        <canvas id="cv"></canvas>
      </section>
    </div>

    <!-- 右栏：第一行控制（探测点 / 高度 / 纬度 / 四个按钮），第二行实时数据 -->
    <div class="col-right">
      <section class="card controls" id="controls">
        <div class="ctrl-head">
          <span class="t1">探测点</span>
          <!-- 操作提示由画布 HUD 承担（拖动旋转 · 滚轮缩放 · 拖红点改高度／纬度），此处不再重复 -->
        </div>

        <div class="params">
          <div class="prow">
            <span class="pl">高度 <i>h</i></span>
            <input type="range" id="sH" min="0" max="1000" value="300" step="1">
            <span class="pv"><b id="vH">1 911</b><span class="un"> km</span></span>
          </div>
          <div class="prow" id="rowPhi">
            <span class="pl">纬度 <i>φ</i></span>
            <input type="range" id="sPhi" min="-90" max="90" value="35" step="1">
            <span class="pv"><b id="vPhi">35</b><span class="un">°</span></span>
          </div>
        </div>

        <div class="tools">
          <button class="btn demo" id="btnAuto" type="button" title="点击停止自转 · 60 s/周">停止自转</button>
          <button class="btn on" id="btnReset" type="button" title="回到自由视角（默认角度）" aria-pressed="true">重置视角</button>
          <button class="btn" id="btnMer" type="button" title="经线截面视角：沿探测点所在经线切开，剖面正对屏幕" aria-pressed="false">经线截面</button>
          <button class="btn" id="btnEq" type="button" title="赤道截面视角：从北极上方俯视，赤道面正对屏幕" aria-pressed="false">赤道截面</button>
        </div>
      </section>

      <section class="card info" id="info">
        <h2 class="rd-h">实时读数</h2>

        <div class="rd-g">
          <span class="rd-k">重力 <i>g</i> / (m·s⁻²)</span>
          <b class="rd-v" id="rG">—</b>
        </div>
        <!-- h / φ 的数值就在上方控制区滑块旁，这里不再重复大数字，只留 r 与半球 -->
        <div class="rd-sub rd-meta"><span id="rR">r = — R</span><span class="dot">·</span><span id="rHemi">—</span></div>

        <!-- 表体由 JS 按 SHELL_R 生成：修改壳层半径时这里自动跟着变 -->
        <div class="rd-tbl" id="rTbl">

<script>
(function(){
"use strict";

/* ================= 物理常量 ================= */
var GM     = 3.986004418e14;   // 引力常量 × 地球质量，m^3/s^2
var RE     = 6.371e6;          // 地球平均半径，m
var OMEGA  = 7.2921159e-5;     // 地球自转角速度，rad/s
var HMAX   = RE;               // 高度上限 = R（场景半径上限 2R）
var G0     = GM / (RE * RE);   // 地表万有引力加速度 ≈ 9.82 m/s^2
var SPIN_PERIOD = 60;          // 可视化自转周期，s/周（缓慢）

/* ================= 署名配置 ================= */
var AUTHOR_CFG = { author:'熊和平（大熊印象）', org:'', version:'V1.10' };

/* ================= DOM ================= */
function $(id){ return document.getElementById(id); }
var cv = $('cv'), ctx = cv.getContext('2d');
var stageEl = $('stage');
var footEl = $('foot'), headerEl = document.querySelector('header.top');

/* ================= 主题（DOM + canvas 双轨） ================= */
var THEMES = {
  dark: {
    cvBg1:'#101a2e', cvBg2:'#0a1120',
    grid:'rgba(120,150,200,0.12)',
    earth0:'#2f6bc4', earth1:'#0e2547', earthEdge:'#7faeff',
    wire:'rgba(165,205,255,0.22)', lat:'rgba(165,205,255,0.16)',
    arrow:'#7fb0ff', probe:'#ff5f9e', equat:'#ffd257',
    hud:'#c9d6ea', hud2:'#8fa3c0', dim:'rgba(143,163,192,0.62)',
    shade:'rgba(2,8,20,0.46)', texVeil:null,
    /* 质感升级新增：星空（starN 密度系数）+ 暗角 + 地球外柔曦 + HUD 描边光晕 */
    star:'#ffffff', star2:'#cfe0ff', starN:1,
    vin:'rgba(2,8,20,.32)', earthGlow:'rgba(90,150,255,.16)',
    hudHalo:'rgba(8,14,28,.85)', rimHi:'rgba(255,255,255,.22)'
  },
  light: {
    cvBg1:'#f4f7fb', cvBg2:'#e9eff7',
    grid:'rgba(30,60,110,0.10)',
    earth0:'#bcd3f4', earth1:'#7ea6dd', earthEdge:'#2f5fae',
    wire:'rgba(30,70,140,0.22)', lat:'rgba(30,70,140,0.15)',
    arrow:'#1d4ed8', probe:'#d6316f', equat:'#c2410c',
    hud:'#33415c', hud2:'#5b6672', dim:'rgba(91,102,114,0.6)',
    shade:'rgba(24,48,90,0.28)', texVeil:'rgba(255,255,255,0.30)',
    /* 质感升级新增（浅色：星星极低密度近隐形、暗角更弱、光晕改浅） */

    vin:'rgba(40,60,90,.10)', earthGlow:'rgba(120,160,230,.20)',
    hudHalo:'rgba(255,255,255,.90)', rimHi:'rgba(255,255,255,.55)'
  }
};

var PAL = THEMES.dark;
var FONT = '"Times New Roman",Times,"PingFang SC","Microsoft YaHei",sans-serif';

function isLight(){ return PAL === THEMES.light; }
/* 径向柔光离屏精灵（缓存）：球外柔曦等一次性大光斑用，避免每帧建渐变 */
var __spr = {};
function softSprite(col, r){
  var k = col + '|' + r;
  if (!__spr[k]){
    var s = document.createElement('canvas');
    s.width = s.height = r*2;
    var sc = s.getContext('2d');
    var g = sc.createRadialGradient(r, r, 0, r, r, r);
    g.addColorStop(0, col);
    g.addColorStop(1, 'rgba(0,0,0,0)');   /* 全透明停靠点：只借 alpha，不引入色相 */
    sc.fillStyle = g; sc.fillRect(0, 0, r*2, r*2);
    __spr[k] = s;
  }
  return __spr[k];
}

function setTheme(light){
  applyTheme(light);
  try{ localStorage.setItem('hm_theme', light ? 'light' : 'dark'); }catch(e){}
}

/* ================= 状态 ================= */
var probe = { h: 0.30 * HMAX, phi: 35 };

var VV = { yaw: 0, tilt: 0.34, zoom: 1 };

/* ================= 工具 ================= */
function clamp(v,a,b){ return v < a ? a : (v > b ? b : v); }
function km(v){ return Math.round(v).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
function px(v){ var f = parseFloat(v); return isFinite(f) ? f : 0; }

/* ================= 物理 ================= */
function gGrav(r){ return GM / (r * r); }
/* 考虑自转的「重力」大小：重力 = 万有引力 − 向心力（矢量差）
   子午面内：|g|^2 = (gGrav − ω²r)²cos²φ + gGrav²sin²φ */
function weightMag(r, phiDeg){
  var phi = phiDeg * Math.PI / 180;
  var st = Math.cos(phi), ct = Math.sin(phi);
  var g = gGrav(r), w = OMEGA * OMEGA * r;
  return Math.sqrt((g - w) * (g - w) * st * st + g * g * ct * ct);
}

/* ================= 画布尺寸 ================= */
var W = 0, H = 0;
var CAM = 6.4;                     /* 相机到球心距离（单位 R）：越小透视越强、立体感越足 */
var V = { cx:0, cy:0, S:120, yaw:0, tilt:0.34, pers:1 };
var PAD = { t:54, b:36, l:24, r:20 };

function fitCanvas(){
  var dpr = Math.min(2, window.devicePixelRatio || 1);
  var w = cv.clientWidth, h = cv.clientHeight;
  if (w < 10 || h < 10) return;
  cv.width = Math.round(w * dpr);
  cv.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  W = w; H = h;
  layout();
}

/* ================= 三维投影（自写小引擎，不引第三方库） =================
   世界坐标：y 轴朝北极（向上），x/z 张成赤道面，长度单位 = 地球半径 R。
   相机在 +z 方向：先绕 y 轴偏航（yaw），再绕 x 轴俯仰（tilt），
   最后做弱透视 f = CAM/(CAM − z)。 */
function v3(x, y, z){ return { x:x, y:y, z:z }; }
function vmul(p, k){ return { x:p.x*k, y:p.y*k, z:p.z*k }; }
function rotY(p, a){
  var c = Math.cos(a), s = Math.sin(a);
  return { x: p.x*c + p.z*s, y: p.y, z: p.z*c - p.x*s };
}
function applyCam(p){
  var q = rotY(p, V.yaw), ct = Math.cos(V.tilt), st = Math.sin(V.tilt);
  return { x: q.x, y: q.y*ct - q.z*st, z: q.y*st + q.z*ct };
}
function unCam(c){
  var ct = Math.cos(V.tilt), st = Math.sin(V.tilt);
  return rotY({ x:c.x, y: c.y*ct + c.z*st, z: c.z*ct - c.y*st }, -V.yaw);
}
function toScr(c, s, ox, oy){
  var f = V.pers ? CAM / (CAM - c.z) : 1;
  return { x: ox + c.x*s*f, y: oy - c.y*s*f, z: c.z, f: f };
}
function P(p){ return toScr(applyCam(p), V.S, V.cx, V.cy); }
function PS(p, spin){ return toScr(applyCam(rotY(p, spin)), V.S, V.cx, V.cy); }   /* 随球体自转的材料 */
function depthK(z){ return clamp((z + 2.4) / 4.8, 0, 1); }   /* 0=最远 1=最近 */

/* 按一组世界点自动定标：把投影后的包围盒塞进画布可用区 */
function sceneFit(pts){
  var x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  for (var i = 0; i < pts.length; i++){
    var q = toScr(applyCam(pts[i]), 1, 0, 0);
    if (q.x < x0) x0 = q.x; if (q.x > x1) x1 = q.x;
    if (q.y < y0) y0 = q.y; if (q.y > y1) y1 = q.y;
  }
  var bw = Math.max(1e-6, x1 - x0), bh = Math.max(1e-6, y1 - y0);
  var avW = Math.max(60, W - PAD.l - PAD.r), avH = Math.max(60, H - PAD.t - PAD.b);
  var s = Math.min(avW / bw, avH / bh);
  V.S = s;
  V.cx = PAD.l + (avW - bw*s) / 2 - x0*s;
  V.cy = PAD.t + (avH - bh*s) / 2 - y0*s;
}

function sphereFitPts(){
  /* 定标半径取 2.14R（而不是最外那层壳的 2.00R）：h 到顶（r=2R）时探测点的
     箭头还要再往外伸一截，留出这点余量，箭头尾才不会顶到画布边缘。 */
  var RF = 2.14;
  var pts = [], lats = [-84, -56, -28, 0, 28, 56, 84], lons = [0, 45, 90, 135, 180, 225, 270, 315];
  for (var i = 0; i < lats.length; i++){
    var la = lats[i]*Math.PI/180, cp = Math.cos(la), sp = Math.sin(la);
    for (var j = 0; j < lons.length; j++){
      var lo = lons[j]*Math.PI/180;
      pts.push(v3(RF*cp*Math.cos(lo), RF*sp, RF*cp*Math.sin(lo)));
    }
  }
  return pts;
}

function layout(){
  V.yaw = VV.yaw; V.tilt = VV.tilt; V.pers = 1;
  /* 场景是圆的、画布是宽的 ⇒ 四角天然是空的，标题与右侧读数面板正好摆进空角 */
  /* 读数已搬到右栏卡片里 ⇒ 画布四边只留等距安全边，球回正到画布中央 */
  PAD.t = 26; PAD.b = 30;
  PAD.l = 22; PAD.r = 22;
  sceneFit(sphereFitPts());
  V.S *= VV.zoom;                     /* 缩放绕球心（原点）进行 */
}

function chromeH(){
  /* 控制卡已搬进右栏（与画布并排），不再占页面的纵向空间 —— 这里不能减它，
     否则会白扣一条控制条的高度，画布反而变矮。 */
  var h = 0;
  h += headerEl.offsetHeight + 12;
  h += px(getComputedStyle(stageEl).paddingTop) + px(getComputedStyle(stageEl).paddingBottom);
  h += footEl.offsetHeight + 16;
  h += px(getComputedStyle(document.body).paddingTop) + px(getComputedStyle(document.body).paddingBottom);
  return h;
}
/* 右栏「还差多少高度」：数据卡被 overflow:hidden 裁掉的部分 + 对照表自身被压掉的部分。
   注意两者不会重复计数 —— 表是 flex:1 的收缩块，它被压扁时 info 的 scrollHeight 并不会变大。 */
function colsShortfall(){
  var n = 0, info = $('info'), tbl = $('rTbl');
  if (info) n += Math.max(0, info.scrollHeight - info.clientHeight);
  if (tbl) n += Math.max(0, tbl.scrollHeight - tbl.clientHeight);
  return n;
}
/* 设画布高度 = 同时把 .cols 的行高钉死。
   不钉的话右栏「控制卡 + 数据卡」的 max-content 会把 grid 行顶高，
   而 fitViewport 只能削画布、削不动右栏 ⇒ 削了也不降页高 ⇒ 永久滚动条（老坑的结构性解法）。
   ★ 但钉死也有反面：窗口太矮（1280×720、或站点 iframe 只有 600 高）时，
   右栏两张卡的自然高度会超过画布高，数据卡底部被静默裁掉（实测 1280×720 少一行表格）。
   所以钉完之后量一次缺口，把行高补到刚好够 —— 宁可页面纵向滚一点，也不让内容凭空消失。 */
function setCanvasH(h){
  h = Math.round(h);
  cv.style.height = h + 'px';
  var cols = document.querySelector('.cols');
  if (cols){
    if (window.innerWidth > 1000){
      var pin = h + px(getComputedStyle(stageEl).paddingTop) + px(getComputedStyle(stageEl).paddingBottom);
      cols.style.height = pin + 'px';
      for (var k = 0; k < 3; k++){          /* 补一次往往不够：表撑开后 info 才暴露出自己的缺口 */
        var need = colsShortfall();
        if (need <= 1) break;
        pin += need;
        cols.style.height = pin + 'px';
      }
    } else {
      cols.style.height = '';       /* 堆叠布局下必须让 .cols 自己长高 */
    }
  }
  fitCanvas();
}
function applySize(){
  var w = cv.clientWidth;
  if (w < 20) return;
  var vh = window.innerHeight || 940;
  var cap = Math.max(300, vh - chromeH());
  /* 窄屏是单列长页：画布若跟着「一屏减去页头」走，会变成一条又高又空的竖条
     （球由宽度定标，上下全是空白）。用 w×1.0 与 0.7vh 双重上限把它压成近方形。 */
  if (window.innerWidth <= 1000) cap = Math.min(cap, Math.max(280, w * 1.0), vh * 0.70);
  /* 控制条移走后「一屏减去页头/页脚」的余量全部归画布；上限抬到 1040，
     否则 1080p 上新增的高度会被 760 这个旧上限整个卡掉。 */
  var h = Math.min(1040, cap);
  setCanvasH(clamp(h, 280, 1040));
}
function fitViewport(){
  var h0 = cv.clientHeight, guard = 0;
  while (guard++ < 3){
    var vh = window.innerHeight || 0;
    if (!vh) break;
    var over = document.documentElement.scrollHeight - vh;
    if (over <= 2) break;
    var h = cv.clientHeight - over;
    if (h < 260) break;
    setCanvasH(h);
    var over2 = document.documentElement.scrollHeight - vh;
    /* 收画布没换来页高下降（说明页高不是画布决定的）⇒ 还原，不能反向加高 */
    if (over2 > over - 2){ setCanvasH(h0); break; }
  }
}

/* ================= 文本分段绘制（画布内准 TeX） ================= */
function fontOf(s){ return (s.i ? 'italic ' : '') + (s.b ? '700 ' : '400 ') + (s.s || 15) + 'px ' + FONT; }
function segW(segs){
  var w = 0;
  for (var i = 0; i < segs.length; i++){ ctx.font = fontOf(segs[i]); w += ctx.measureText(segs[i].t).width; }
  return w;
}
function drawSeg(x, y, segs, align, color, halo){
  var total = segW(segs), sx = x;
  if (align === 'center') sx = x - total / 2;
  else if (align === 'right') sx = x - total;
  for (var i = 0; i < segs.length; i++){
    var s = segs[i];
    ctx.font = fontOf(s);
    ctx.textAlign = 'left';
    if (halo){                       /* 压在贴图上时先描一圈底色，否则红字遇到浅色陆地就糊了 */
      ctx.strokeStyle = halo; ctx.lineWidth = 3; ctx.lineJoin = 'round';
      ctx.strokeText(s.t, sx, y + (s.dy || 0));
    }
    ctx.fillStyle = s.c || color || PAL.hud;
    ctx.fillText(s.t, sx, y + (s.dy || 0));
    sx += ctx.measureText(s.t).width;
  }
  return total;
}
function arrowSeg(x0, y0, x1, y1, color, lw, head){
  var dx = x1 - x0, dy = y1 - y0;
  var len = Math.sqrt(dx * dx + dy * dy);
  if (len < 0.5) return;
  ctx.save();
  ctx.strokeStyle = color; ctx.fillStyle = color;
  ctx.lineWidth = lw; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
  if (head){
    var ang = Math.atan2(dy, dx);
    var hl = clamp(len * 0.34, 3.5, 9);
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x1 - hl * Math.cos(ang - 0.42), y1 - hl * Math.sin(ang - 0.42));
    ctx.lineTo(x1 - hl * Math.cos(ang + 0.42), y1 - hl * Math.sin(ang + 0.42));
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

/* ================= 地球贴图（等距圆柱纹理 → 逐像素逆投影采样） =================
   贴图以 data URI 内嵌，离线可用。每帧不做三角函数的逆投影：
   先建一次「屏幕像素 → (纬度, 只含俯仰的经度)」查找表，之后每帧只给经度加同一个
   偏移（相机偏航 + 自转），再查纹理 —— 于是自转与旋转都很便宜。 */
var TEX_W = 1024, TEX_H = 512;
var texData = null, texCv = document.createElement('canvas'), texCtx = null;
var texImgData = null, texU = null, texVN = null, texMask = null;
var texX = 0, texY = 0, texBW = 0, texBH = 0, texStep = 1;
var texMapKey = '', texSig = '';
var TWO_PI = Math.PI * 2, INV2PI = 1 / TWO_PI;

(function loadEarthTex(){
  var el = document.getElementById('earthTex');
  if (!el) return;
  var im = new Image();
  im.onload = function(){
    var c = document.createElement('canvas');
    c.width = TEX_W; c.height = TEX_H;
    var g = c.getContext('2d');
    g.drawImage(im, 0, 0, TEX_W, TEX_H);
    try{ texData = g.getImageData(0, 0, TEX_W, TEX_H).data; }catch(e){ texData = null; }
    texMapKey = ''; texSig = '';
  };
  im.src = 'data:image/jpeg;base64,' + el.textContent.replace(/\s+/g, '');
})();

/* 球在屏幕上的真实半径（透视下比 V.S 略大，与经纬网投影一致） */
function globeRp(){ return V.pers ? V.S * CAM / Math.sqrt(CAM * CAM - 1) : V.S; }

function buildTexMap(){
  var key = [V.tilt.toFixed(5), V.S.toFixed(3), V.cx.toFixed(2), V.cy.toFixed(2), W, H].join('|');
  if (key === texMapKey) return;
  texMapKey = key; texSig = '';

  var Rp = globeRp();
  var bx0 = Math.max(0, Math.floor(V.cx - Rp - 1)), bx1 = Math.min(W, Math.ceil(V.cx + Rp + 1));
  var by0 = Math.max(0, Math.floor(V.cy - Rp - 1)), by1 = Math.min(H, Math.ceil(V.cy + Rp + 1));
  var bw = bx1 - bx0, bh = by1 - by0;
  if (bw < 8 || bh < 8) return;

  var step = Math.max(1, Math.ceil(Math.max(bw, bh) / 340));
  var nw = Math.ceil(bw / step), nh = Math.ceil(bh / step), n = nw * nh;
  if (!texU || texU.length !== n){
    texU = new Float32Array(n); texVN = new Int32Array(n); texMask = new Uint8Array(n);
  }
  texX = bx0; texY = by0; texBW = nw; texBH = nh; texStep = step;
  if (texCv.width !== nw || texCv.height !== nh){ texCv.width = nw; texCv.height = nh; texCtx = null; }
  if (!texCtx) texCtx = texCv.getContext('2d');
  /* 尺寸没变就复用 ImageData：视角过渡时每帧都会重建查找表，避免 228KB/帧 的垃圾 */
  if (!texImgData || texImgData.width !== nw || texImgData.height !== nh){
    texImgData = texCtx.createImageData(nw, nh);
  }

  var ct = Math.cos(V.tilt), st = Math.sin(V.tilt);
  var k = 1 / (V.S * CAM), cc = CAM * CAM;
  for (var j = 0; j < nh; j++){
    var sy = by0 + (j + 0.5) * step, dy = (V.cy - sy) * k;
    for (var i = 0; i < nw; i++){
      var idx = j * nw + i;
      var sx = bx0 + (i + 0.5) * step, dx = (sx - V.cx) * k;
      /* 视线 (dx, dy, -1)，相机在 (0,0,CAM)，与单位球求交 */
      var A = dx*dx + dy*dy + 1;
      var disc = 4*cc - 4*A*(cc - 1);
      if (disc <= 0){ texMask[idx] = 0; continue; }
      var t = (2*CAM - Math.sqrt(disc)) / (2*A);
      var px = dx*t, py = dy*t, pz = CAM - t;
      /* 只去掉俯仰：偏航等价于给经度加常量，不必进表 */
      var wy = py*ct + pz*st, wz = pz*ct - py*st;
      var lat = wy > 1 ? Math.PI/2 : (wy < -1 ? -Math.PI/2 : Math.asin(wy));
      var lon = Math.atan2(wz, px);
      if (lon < 0) lon += TWO_PI;
      texU[idx] = lon;
      var vi = ((0.5 - lat / Math.PI) * TEX_H) | 0;
      texVN[idx] = vi < 0 ? 0 : (vi >= TEX_H ? TEX_H - 1 : vi);
      texMask[idx] = 1;
    }
  }
}

function paintGlobeTexture(){
  if (!texData || !texMask || !texImgData) return false;
  var sig = texMapKey + '|' + spinAng.toFixed(4);
  if (sig !== texSig){
    var d = texImgData.data, src = texData, off = V.yaw - spinAng, n = texBW * texBH;
    for (var idx = 0; idx < n; idx++){
      var o = idx << 2;
      if (!texMask[idx]){ d[o + 3] = 0; continue; }
      var a = texU[idx] + off + Math.PI;   /* u=0 对应 180°W */
      a -= Math.floor(a * INV2PI) * TWO_PI;
      var tx = (a * INV2PI * TEX_W) | 0;
      if (tx >= TEX_W) tx = TEX_W - 1;
      var s = ((texVN[idx] * TEX_W) + tx) << 2;
      d[o] = src[s]; d[o + 1] = src[s + 1]; d[o + 2] = src[s + 2]; d[o + 3] = 255;
    }
    texCtx.putImageData(texImgData, 0, 0);
    texSig = sig;
  }
  ctx.drawImage(texCv, texX, texY, texBW * texStep, texBH * texStep);
  return true;
}

/* ================= 球形场景（三维径向场） ================= */
var LAM0 = Math.PI / 4;        /* 探测点所在经度：面向观察者、略偏右，便于看出深度 */
var LEN0 = 0.46;               /* 地表处箭头长度（单位 R） */
var SHELL_R = [1.30, 1.65, 2.00];

/* ★ 采样方向 = **全片唯一的真源**：一张等 30° 的经纬网格。
   三个视角都不是另起一套表，而是同一张网的不同切法 ——
     · 自由视角：全部 50 个方向；
     · 赤道截面：只取 la = 0 的那一环（12 方位）；
     · 经线截面：按纬度去重（12 方向，等 30°）。
   所以「截面的疏密」由全局纬度环数直接决定，改这里截面自动跟着变。

   纬度环 0 / ±30 / ±60，经度根数按环周长给 12 / 12 / 12 / 6 / 6 ——
   6 根 × 60° 的环向弧长（0.524 R）与赤道 12 根 × 30° **完全相等**，高纬并不疏；
   反过来给 ±60 也放 12 根，高纬会密一倍，就成了「赤道稀、两极挤」。

   所有环**同相位**（起点都是 spinAng，不再交错半格）：这样箭头正好落在
   drawGlobe 画的纬线 ±30/±60 与 12 条经线的交点上，截面切下去也是同一批纬线。
   —— 存的是「固连在地球上的纬度/经度」：绘制时经度再加 spinAng，
   于是整片场跟着地球一起转（场由地球质量产生，本就该随地球转）。 */
var RAYS = (function(){
  var out = [], bands = [
    { lat:-60, n:6 }, { lat:-30, n:12 }, { lat:0, n:12 }, { lat:30, n:12 }, { lat:60, n:6 }
  ];
  for (var b = 0; b < bands.length; b++){
    var la = bands[b].lat*Math.PI/180, n = bands[b].n;
    for (var k = 0; k < n; k++){
      out.push({ la: la, lo: k*2*Math.PI/n });
    }
  }
  /* 南北极各补一根：极点上 cosφ=0，方向恒为 (0,±1,0)，与经度无关 ⇒ 一根即可 */
  out.push({ la:  Math.PI / 2, lo: 0 });
  out.push({ la: -Math.PI / 2, lo: 0 });
  return out;
})();

/* 截面方向从 RAYS 派生 —— 在模块加载时算一次。
   放到 refreshDirs 里每帧去重会不停新建临时字符串/对象（每秒上千个），
   表现为偶发的 GC 尖峰。 */
var EQ_RAYS = (function(){
  var out = [];
  for (var i = 0; i < RAYS.length; i++) if (Math.abs(RAYS[i].la) < 1e-9) out.push(RAYS[i]);
  return out;                     /* 12 条：赤道环。⚠️ 依赖 RAYS 里必须留着 la=0 这一环 */
})();
var MER_LAT = (function(){
  var out = [], seen = {};
  for (var i = 0; i < RAYS.length; i++){
    var la = RAYS[i].la;
    /* 两极的纬度绝对值相同但方向相反，key 必须分开 —— 用一个 '|pole|' 会把南极吞掉 */
    var key = (Math.abs(Math.cos(la)) < 1e-9) ? (la > 0 ? '|N|' : '|S|') : la.toFixed(6);
    if (seen[key]) continue;
    seen[key] = 1;
    out.push(la);
  }
  return out.sort(function(a, b){ return a - b; });   /* -90,-60,-30,0,30,60,90 共 7 层 */
})();

/* 本帧的箭头方向：`经度 + spinAng`，与 drawGlobe 里经线用的 spinAng 同号。
   截面模式下换成「截面内采样」，数量也随之变化（50 / 12 / 12）——
   所以遍历一律以 DIRS.length 为准。 */
var DIRS = [];
function refreshDirs(){
  DIRS.length = 0;
  var i;
  if (curPreset === 'eq'){
    /* 赤道面 = 全局网格里 lat=0 的那一环（12 方位，与原来逐个等分的结果完全相同）。
       ⚠️ 这里依赖 RAYS 里必须留着 la=0 —— 改纬度带时别把它丢掉，
          否则会静默变成 0 根箭头（画面只剩地球，还不报错）。
       自转此时已冻结，加 spinAng 只为切回自由视角时位置连续。 */
    for (i = 0; i < EQ_RAYS.length; i++){
      var lo = EQ_RAYS[i].lo + spinAng;
      DIRS.push({ x: Math.cos(lo), y: 0, z: Math.sin(lo) });
    }
    return;
  }
  if (curPreset === 'mer'){
    /* 子午面：一条大圆 = 两条半经线（LAM0 与 LAM0+180°）拼成，左右对称。
       相机 yaw = LAM0 正对该面 ⇒ 投到屏幕上是三层同心圆，每个纬度的箭头都横躺着，
       长度（∝GM/r²）与纬度差异能并排比较；只用单侧经线则会剩半个圆、赤道方向还被压成一点。
       纬度取自 MER_LAT（= RAYS 的纬度集合去重）⇒ **截面层数恒等于全局纬度环数**，
       所以这里不再有自己的密度配置。
       cp=0 的 ±90° 两侧会给出同一方向 ⇒ 只留一份，否则叠画两遍、alpha 变成两倍。 */
    var cL = Math.cos(LAM0), sL = Math.sin(LAM0);
    for (i = 0; i < MER_LAT.length; i++){
      var cp = Math.cos(MER_LAT[i]), sp = Math.sin(MER_LAT[i]);
      DIRS.push({ x: cp*cL, y: sp, z: cp*sL });
      if (Math.abs(cp) > 1e-9) DIRS.push({ x: -cp*cL, y: sp, z: -cp*sL });
    }
    return;
  }
  for (i = 0; i < RAYS.length; i++){
    var a = RAYS[i], l2 = a.lo + spinAng, c2 = Math.cos(a.la), s2 = Math.sin(a.la);
    DIRS.push({ x: c2*Math.cos(l2), y: s2, z: c2*Math.sin(l2) });
  }
}

/* 场箭头：三层壳（1.30R / 1.65R / 2.00R），径向指向地心，长度 ∝ GM/r²
   back=true 画背面（先画，随后被地球本体挡住）→ 暗、细；
   back=false 画正面 → 亮、粗。远近用 depthK 连续调，形成立体纵深。
   截面视角下背面/正面没有意义（箭头都在球外，赤道面上的点 z 还正负各半），
   一律按「正面」画一遍即可，否则会有一半箭头被画成灰暗的「背面」。
   ⚠️ mer 视角下 tilt=0、yaw=LAM0，每个方向投到相机系后 z **恒等于 0**（残差 ~1e-17），
      正/背面判据在这里彻底退化 —— 全靠下面那行 flat 早退兜底。若哪天把它删掉，
      1e-17 的随机符号会让剖面恰好丢掉一半箭头，而且现象随机器/浏览器变化，极难排查。 */
function drawFieldShells(back){
  var flat = (curPreset === 'eq' || curPreset === 'mer');
  if (flat && back) return;        /* ← mer 下 bC.z ≡ 0，这行是唯一兜底，见上 */
  for (var s = 0; s < SHELL_R.length; s++){
    var r = SHELL_R[s], len = LEN0 / (r * r);
    for (var i = 0; i < DIRS.length; i++){
      var d = DIRS[i];
      /* 极点方向与其它方向走同一套正/背面分流：俯仰 0.34 时南极确实更远，
         该暗就暗 —— 否则「近亮远暗＝深度」这条图例在极点处自相矛盾。 */
      var bC = applyCam(vmul(d, r));
      if (!flat && ((bC.z < 0) !== back)) continue;
      var tC = applyCam(vmul(d, r - len));
      var A = toScr(bC, V.S, V.cx, V.cy), B = toScr(tC, V.S, V.cx, V.cy);
      var k = depthK(bC.z);
      ctx.save();
      if (back){
        ctx.globalAlpha = 0.16 + 0.28*k;
        arrowSeg(A.x, A.y, B.x, B.y, PAL.arrow, 1.1 + 0.8*k, true);
      } else {
        ctx.globalAlpha = 0.58 + 0.42*k;
        arrowSeg(A.x, A.y, B.x, B.y, PAL.arrow, 1.6 + 1.4*k, true);
      }
      ctx.restore();
    }
  }
}

/* 地球本体：贴图球面 + 淡经纬网 + 显眼的赤道（只画朝向观察者的一半） */
function drawGlobe(){
  var Rp = globeRp(), cx = V.cx, cy = V.cy, i, k;

  /* 球外柔曦：贴在星空上的一圈大气辉光（半径随球走，key 含 Rp 自动重建） */
  var GR = Math.round(Rp * 1.3);
  ctx.drawImage(softSprite(PAL.earthGlow, GR), cx - GR, cy - GR, GR*2, GR*2);

  ctx.textBaseline = 'alphabetic';
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, Rp, 0, TWO_PI); ctx.clip();

  /* 底色（贴图未就绪时它就是球面） */
  var bg = ctx.createRadialGradient(cx - Rp*0.34, cy - Rp*0.40, Rp*0.05, cx, cy, Rp*1.06);
  bg.addColorStop(0, PAL.earth0); bg.addColorStop(1, PAL.earth1);
  ctx.fillStyle = bg; ctx.fillRect(cx - Rp, cy - Rp, 2*Rp, 2*Rp);

  buildTexMap();
  if (paintGlobeTexture()){
    if (PAL.texVeil){ ctx.fillStyle = PAL.texVeil; ctx.fillRect(cx - Rp, cy - Rp, 2*Rp, 2*Rp); }
    /* 受光：左上亮、右下暗 —— 球体的鼓感就出来了 */
    var sg = ctx.createRadialGradient(cx - Rp*0.40, cy - Rp*0.44, Rp*0.10, cx, cy, Rp*1.16);
    sg.addColorStop(0, 'rgba(255,255,255,0.15)');
    sg.addColorStop(0.46, 'rgba(255,255,255,0)');
    sg.addColorStop(1, PAL.shade);
    ctx.fillStyle = sg; ctx.fillRect(cx - Rp, cy - Rp, 2*Rp, 2*Rp);
  }

  /* 纬线（赤道另画，见下） */
  var lats = [-60, -30, 30, 60];
  for (i = 0; i < lats.length; i++){
    var la = lats[i]*Math.PI/180, rr = Math.cos(la), yy = Math.sin(la);
    ctx.beginPath();
    var on = false;
    for (k = 0; k <= 96; k++){
      var lo = k * TWO_PI / 96;
      var c3 = applyCam(v3(rr*Math.cos(lo), yy, rr*Math.sin(lo)));
      var q = toScr(c3, V.S, V.cx, V.cy);
      if (c3.z > 0.002){ if (on) ctx.lineTo(q.x, q.y); else { ctx.moveTo(q.x, q.y); on = true; } }
      else on = false;
    }
    ctx.strokeStyle = PAL.lat; ctx.lineWidth = 1; ctx.globalAlpha = 0.9; ctx.stroke();
  }
  ctx.globalAlpha = 1;

  /* 经线：随自转扫动（12 条半经线 = 6 个大圆）。
     30° 一根，与 RAYS 的经度网格**同相位同源**（两边都是 spinAng + k·30°）⇒
     每个场箭头正好落在经纬网的交点上，不再与网格错开半格。 */
  for (var m = 0; m < 12; m++){
    var lam = spinAng + m * Math.PI / 6;
    ctx.beginPath();
    var on2 = false;
    for (k = 0; k <= 48; k++){
      var th = -Math.PI/2 + k * Math.PI / 48;
      var c4 = applyCam(v3(Math.cos(th)*Math.cos(lam), Math.sin(th), Math.cos(th)*Math.sin(lam)));
      var q2 = toScr(c4, V.S, V.cx, V.cy);
      if (c4.z > 0.002){ if (on2) ctx.lineTo(q2.x, q2.y); else { ctx.moveTo(q2.x, q2.y); on2 = true; } }
      else on2 = false;
    }
    ctx.strokeStyle = PAL.wire; ctx.lineWidth = 1; ctx.globalAlpha = 0.8; ctx.stroke();
  }
  ctx.globalAlpha = 1;

  /* 赤道：最显眼的一条 —— 加粗 + 同色柔光。
     接近正俯视（|tilt|→1.50）时，赤道各点的朝向几乎与视线垂直，
     原来「z>0」的背面裁剪会把远侧半圈切掉、只剩底部一段弧（看着像根贴边的小弧，不成圈）。
     这里按 |tilt| 把远侧半圈淡入补上，让它闭合成完整的最外圈；默认视角 eqFade=0，逐点等价于原绘制。 */
  var eqFade = clamp((Math.abs(V.tilt) - 1.30) / 0.18, 0, 1);
  var eqP = [], eqZ = [];
  for (k = 0; k <= 140; k++){
    var lo3 = k * TWO_PI / 140;
    var c5 = applyCam(v3(Math.cos(lo3), 0, Math.sin(lo3)));
    eqP.push(toScr(c5, V.S, V.cx, V.cy)); eqZ.push(c5.z);
  }
  var leftMost = null, leftAll = null;
  for (k = 0; k < eqP.length; k++){
    if (!leftAll || eqP[k].x < leftAll.x) leftAll = eqP[k];
    if (eqZ[k] > 0.001 && (!leftMost || eqP[k].x < leftMost.x)) leftMost = eqP[k];
  }
  var strokeEq = function (alpha, wantFront){
    ctx.beginPath();
    var on = false;
    for (var i2 = 0; i2 < eqP.length; i2++){
      var ok = wantFront ? (eqZ[i2] > 0.001) : (eqZ[i2] <= 0.001);
      if (ok){
        if (on) ctx.lineTo(eqP[i2].x, eqP[i2].y); else { ctx.moveTo(eqP[i2].x, eqP[i2].y); on = true; }
      } else on = false;
    }
    ctx.globalAlpha = alpha; ctx.stroke(); ctx.globalAlpha = 1;
  };
  ctx.save();
  ctx.strokeStyle = PAL.equat; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
  ctx.shadowColor = PAL.equat; ctx.shadowBlur = 6;
  if (eqFade > 0.02) strokeEq(0.55 * eqFade, false);   /* 远侧半圈：淡入，补成完整一圈 */
  strokeEq(1, true);
  ctx.restore();

  ctx.restore();   /* 结束剪裁 */

  /* 大气边缘 */
  ctx.strokeStyle = PAL.earthEdge; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.arc(cx, cy, Rp, 0, TWO_PI); ctx.stroke();
  /* 内侧受光弧：贴着大气边内圈的 1px 高光，球体更"鼓" */
  ctx.strokeStyle = PAL.rimHi; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(cx, cy, Rp - 1.2, 0, TWO_PI); ctx.stroke();

  /* 赤道标签（摆在赤道弧的最左端，靠左缘时改放右侧） */
  var labPt = (eqFade > 0.5) ? leftAll : leftMost;    /* 补成整圈后指向外圈最左点 */
  if (labPt){
    var lab = '赤道', lx = labPt.x - 9, al = 'right';
    if (lx < 48){ lx = labPt.x + 9; al = 'left'; }
    ctx.font = '700 14px ' + FONT; ctx.fillStyle = PAL.equat;
    ctx.textAlign = al; ctx.textBaseline = 'middle';
    ctx.fillText(lab, lx, labPt.y);
    ctx.textBaseline = 'alphabetic';
  }

  /* 自转轴（虚线）与 N/S —— 俯视时两极会挤到球心，只留朝前的那个。
     ★ 极点箭头（1.30R 壳的内端落在 1.028R）会穿过 1.16R 处的标签与轴线：
       轴线收到 ±1.06（刚出球面一点），N/S 改右对齐摆到轴线左侧 13px ——
       右侧要留给探测点在「径向竖直」时的 g 读数，不能占。 */
  var cN = applyCam(v3(0, 1.16, 0)), cS = applyCam(v3(0, -1.16, 0));
  var aN = toScr(cN, V.S, V.cx, V.cy), aS = toScr(cS, V.S, V.cx, V.cy);
  var tN = toScr(applyCam(v3(0, 1.06, 0)), V.S, V.cx, V.cy);
  var tS = toScr(applyCam(v3(0, -1.06, 0)), V.S, V.cx, V.cy);
  var split = Math.abs(aN.x - aS.x) + Math.abs(aN.y - aS.y) > 26;
  var drawN = split || cN.z > 0, drawS = split || cS.z > 0;
  if (drawN && drawS){
    ctx.save();
    ctx.setLineDash([4, 4]); ctx.strokeStyle = PAL.dim; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(tN.x, tN.y); ctx.lineTo(tS.x, tS.y); ctx.stroke();
    ctx.restore();
  }
  ctx.save();
  ctx.font = '400 14px ' + FONT; ctx.fillStyle = PAL.hud2;
  ctx.textAlign = 'right';
  /* 放大到极点跑出画布时就不画了，免得半个字母挂在边上（描边光晕替代 shadow） */
  if (drawN && aN.y > 18 && aN.x - 13 > 12) haloText('N', aN.x - 13, aN.y - 5);
  if (drawS && aS.y < H - 10 && aS.x - 13 > 12) haloText('S', aS.x - 13, aS.y + 15);
  ctx.restore();
}

/* 探测点：三维定位 + 径向场强箭头（尾在外、头贴探测点，指向地心） */
function probeR(){ return 1 + probe.h / RE; }
function probeDir(){
  var phi = probe.phi * Math.PI / 180;
  return v3(Math.cos(phi)*Math.cos(LAM0), Math.sin(phi), Math.cos(phi)*Math.sin(LAM0));
}
/* 探测点是否朝向相机。
   ⚠️ 截面视角下这个判据是退化的：经线截面 tilt=0、赤道截面 tilt=1.50，
      探测点恰好落在截面里 ⇒ applyCam 后的 z 恒为 0（只剩 ±1e-17 的浮点残差），
      符号随纬度/机器而变 —— 曾表现为「经线截面 φ=±90° 时探测点变空心、g 值消失」。
      所以截面模式一律按可见处理；自由视角用 -1e-9 容差把噪声挡掉。 */
function probeFront(){
  if (secMode()) return true;
  return applyCam(vmul(probeDir(), probeR())).z >= -1e-9;
}
/* front=false 只影响矢量箭头（背面的箭头画在球前就成了「穿透球体」的假象）；
   探测点与 g 读数任何视角都画 —— 探测点恒为实心圆点（2026-10-24 定）。 */
function drawProbe3D(front){
  var r = probeR(), d = probeDir();
  var gW = weightMag(RE + probe.h, probe.phi);
  var len = LEN0 * gW / G0;

  var D = P(vmul(d, r));
  var A = P(vmul(d, r + len + 0.05));      /* 尾 */
  var T = P(vmul(d, r + 0.045));           /* 头：指向地心 */

  /* 给箭头一圈背景色柔光，压在贴图上才看得清 */
  if (front){
    ctx.save();
    ctx.shadowColor = PAL.hudHalo; ctx.shadowBlur = 5;
    arrowSeg(A.x, A.y, T.x, T.y, PAL.arrow, 3.0, true);
    ctx.restore();
  }

  /* 探测点：粉红实心圆点（不套白边 —— 白圈会把小圆点读成"空心圈"）。
     只加一圈底色柔光，压在明亮的云层／陆地上才能和贴图分开。 */
  ctx.save();
  ctx.shadowColor = PAL.hudHalo; ctx.shadowBlur = 5;
  ctx.fillStyle = PAL.probe;
  ctx.beginPath(); ctx.arc(D.x, D.y, 6.8, 0, TWO_PI); ctx.fill();
  ctx.restore();

  /* 读数沿「地心→探测点」往外摆，避开箭头与点；被画布边缘挡住就改放探测点旁边 */
  var segs = [{ t:'g', i:true, s:18 }, { t:' = ' + gW.toFixed(2), s:18 }];
  var sw = segW(segs);
  var maxX = W - 12;
  var ox = D.x - V.cx, oy = D.y - V.cy, ol = Math.sqrt(ox*ox + oy*oy);
  var alen = Math.sqrt((T.x-A.x)*(T.x-A.x) + (T.y-A.y)*(T.y-A.y));
  var off = alen * 0.55 + 30;
  var lx, ly, al;
  if (ol < 1.5 || (Math.abs(ox) < 1 && Math.abs(oy) > 1)){
    /* 径向正好竖直（经线截面视角）或探测点就投影在球心：沿径向摆会顶到 N 标签上，改放点右侧 */
    al = 'left'; lx = D.x + 14; ly = D.y + 5;
    if (lx + sw > maxX){ al = 'right'; lx = D.x - 14; }
  } else {
    lx = D.x + ox/ol*off; ly = D.y + oy/ol*off + 5; al = 'center';
    if (ly < 34 || ly > H - 26){
      ly = clamp(ly, 34, H - 26); al = 'left'; lx = D.x + 14;
      if (lx + sw > maxX){ al = 'right'; lx = D.x - 14; }
    } else if (lx + sw / 2 > maxX){ al = 'right'; lx = D.x - 14; }
  }
  if (al === 'center') lx = clamp(lx, 10 + sw / 2, Math.max(10 + sw / 2, maxX - sw / 2));
  else if (al === 'left') lx = clamp(lx, 10, Math.max(10, maxX - sw));
  else lx = clamp(lx, 10 + sw, Math.max(10 + sw, maxX));
  /* 经线截面会把探测点固定在球面正前方，红字压在浅色陆地上会被吞掉 —— 描一圈底色 */
  drawSeg(lx, ly, segs, al, PAL.probe, PAL.cvBg1);
}

function renderSphere(){
  refreshDirs();
  drawFieldShells(true);     /* 1. 背面箭头：随后被地球本体遮住，形成遮挡感 */
  drawGlobe();               /* 2. 地球本体（贴图 + 经纬网 + 赤道） */
  drawFieldShells(false);    /* 3. 正面箭头：更亮更粗，压在地球之上 */
  /* 4. 探测点：任何视角都画，且恒为实心圆点（含 g 读数）。
        旧版在背面改画空心圈、连 g 值一起丢掉 —— 截面视角下 z 判据退化，
        会出现「探测点莫名变空心、读数消失」，2026-10-24 起取消这条分支。 */
  drawProbe3D(probeFront());
}

/* ================= HUD（画布内只剩标题/提示/图例/自转状态） =================
   旧版用 shadowBlur 光晕（shadowColor=cvBg1），在星空/复杂背景上会显脏 ——
   改为描边光晕 haloText：先用 hudHalo 色描一圈 3px，再填正文。 */
function haloText(t, x, y){
  ctx.save();
  ctx.strokeStyle = PAL.hudHalo; ctx.lineWidth = 3; ctx.lineJoin = 'round';
  ctx.strokeText(t, x, y);
  ctx.restore();
  ctx.fillText(t, x, y);
}
function renderHUD(){
  var sec = secMode();
  ctx.textBaseline = 'alphabetic';
  ctx.textAlign = 'left';
  ctx.font = '700 17px ' + FONT; ctx.fillStyle = PAL.hud;
  haloText('球形地球的重力场（三维）', 14, 26);
  ctx.font = '400 15px ' + FONT; ctx.fillStyle = PAL.hud2;
  haloText('径向：方向指向地心，离地心越远越短', 14, 47);
  ctx.font = '400 14px ' + FONT; ctx.fillStyle = PAL.dim;
  haloText(sec
    ? (curPreset === 'eq' ? '赤道截面 · 仅显示赤道面上的场（已停转）'
                          : '经线截面 · 仅显示探测点所在子午面上的场（已停转）')
    : '拖动旋转 · 滚轮缩放 · 拖红点改高度／纬度', 14, 68);

  /* 右下：自转状态 */
  ctx.textAlign = 'right'; ctx.font = '400 14px ' + FONT; ctx.fillStyle = PAL.hud2;
  haloText(sec ? '截面视角 · 地球与场已停转'
               : (spinOn ? '地球与场同步自转 · 60 s/周' : '自转已停止'), W - 14, H - 14);

  /* 左下：图例（超出宽度自动舍掉尾项） */
  var items = [
    { t:'● 探测点', c:PAL.probe },
    { t:'▸ 场强箭头', c:PAL.arrow },
    { t:'━ 赤道', c:PAL.equat },
    (sec ? { t:'仅显示截面内的场', c:PAL.hud2 } : { t:'近亮远暗＝深度', c:PAL.hud2 })
  ];
  var lx = 14, ly2 = H - 14;
  for (var i = 0; i < items.length; i++){
    ctx.font = '400 14px ' + FONT;
    var tw = ctx.measureText(items[i].t).width;
    if (lx + tw > W - 205) break;
    ctx.textAlign = 'left'; ctx.fillStyle = items[i].c;
    haloText(items[i].t, lx, ly2);
    lx += tw + 16;
  }
}

/* ================= 星空背景（2026-10-24 新增） =================
   静态星层离屏缓存（key = 宽|高|主题）+ 少量缓慢闪烁星。
   每帧只有 1 次 drawImage + ~10 次小圆，不新建渐变；时间用 performance.now()。
   底部图例区（40px）降密度到 25%，浅色主题 starN≈0（调色板控制）。 */
var __stars = null;
function buildStars(){
  var key = W + '|' + H + '|' + (isLight ? 'l' : 'd');
  if (__stars && __stars.key === key) return;
  var cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  var c = cv.getContext('2d');
  var rnd = (function(){           /* 固定种子的伪随机：同尺寸下星图稳定不跳变 */
    var s = 20261024;
    return function(){ s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  })();
  var n = Math.round(W * H / 9000 * PAL.starN);
  var twk = [];
  for (var i = 0; i < n; i++){
    var x = rnd() * W, y = rnd() * H;
    var big = rnd() < 0.15;
    var r = big ? 1.2 + rnd() * 0.9 : 0.45 + rnd() * 0.65;
    /* 底部图例区降密度：只保留 ~25%，给图例留出干净的底 */
    if (y > H - 40 && rnd() > 0.25) continue;
    c.globalAlpha = 0.35 + rnd() * 0.55;
    c.fillStyle = big ? PAL.star2 : PAL.star;
    c.beginPath(); c.arc(x, y, r, 0, TWO_PI); c.fill();
    if (twk.length < 10 && big && y < H - 60) twk.push({ x:x, y:y, r:r + 0.7, ph:rnd() * TWO_PI });
  }
  __stars = { key:key, cv:cv, twk:twk };
}
function drawStars(){
  buildStars();
  ctx.drawImage(__stars.cv, 0, 0);
  var t = performance.now() / 1000;
  ctx.save();
  for (var i = 0; i < __stars.twk.length; i++){
    var s = __stars.twk[i];
    var a = 0.25 + 0.55 * (0.5 + 0.5 * Math.sin(t * 0.9 + s.ph));   /* 缓慢正弦呼吸 */
    ctx.globalAlpha = a * 0.7;
    ctx.fillStyle = PAL.star;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, TWO_PI); ctx.fill();
  }
  ctx.restore();
}

/* ================= 主渲染 ================= */
function render(){
  if (W < 10 || H < 10) return;
  var g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, PAL.cvBg1); g.addColorStop(1, PAL.cvBg2);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  drawStars();
  /* 暗角：压住四角（星星之后、地球之前 —— 不影响遮挡关系） */
  var vk = W + '|' + H + '|' + (isLight ? 'l' : 'd');
  if (!render.__v || render.__v.k !== vk){
    var vg = ctx.createRadialGradient(W/2, H*0.44, Math.min(W,H)*0.36, W/2, H*0.5, Math.max(W,H)*0.76);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, PAL.vin);
    render.__v = { k:vk, g:vg };
  }
  ctx.fillStyle = render.__v.g; ctx.fillRect(0, 0, W, H);
  renderSphere();
  renderHUD();
  updateReadouts();
}

/* ================= 右侧读数卡（DOM，不在画布里） ================= */
var cache = {}, RC = {};
function setTxt(id, v){
  if (cache[id] === v) return;
  cache[id] = v;
  var el = RC[id] || (RC[id] = $(id));
  if (el) el.textContent = v;
}

/* 表体按 SHELL_R 生成：改了壳层半径，表格自动跟着变（原先是一份硬编码副本） */
function buildRTable(){
  var box = $('rTbl'); if (!box) return;
  box.innerHTML = '<div class="rd-tr hd"><span>r / R</span><span>GM/r²</span></div>';
  var rows = [1].concat(SHELL_R);
  for (var i = 0; i < rows.length; i++){
    var r = rows[i];
    var d = document.createElement('div');
    d.className = 'rd-tr';
    d.innerHTML = '<span>' + r.toFixed(2) + ' R</span><span>' + (G0 / (r * r)).toFixed(2) + '</span>';
    box.appendChild(d);
  }
  setTxt('rEq', weightMag(RE, 0).toFixed(2));
  setTxt('rPole', weightMag(RE, 90).toFixed(2));
}

/* 每帧在 render() 末尾调：probe 不动时 setTxt 全部命中缓存，零 DOM 写入。
   h / φ 的数值由上方控制区滑块旁那两处承担（vH / vPhi），这里不再重复一份大数字。 */
function updateReadouts(){
  var h = probe.h, phi = probe.phi;
  setTxt('rR', 'r = ' + probeR().toFixed(2) + ' R');
  setTxt('rHemi', Math.abs(phi) < 0.5 ? '赤道' : (phi > 0 ? '北纬' : '南纬'));
  setTxt('rG', weightMag(RE + h, phi).toFixed(2));
}

function syncSliders(){
  $('sH').value = Math.round(probe.h / HMAX * 1000);
  $('sPhi').value = Math.round(probe.phi);
  setTxt('vH', km(probe.h / 1000));
  setTxt('vPhi', probe.phi.toFixed(0));
}

/* ================= 视角预设：赤道截面 / 经线截面 / 自由 =================
   只写 VV，再交给 layout() 生效 —— V 每帧从 VV 拷贝，直接写 V 会被覆盖 */
var TILT_LIM = 1.50;          /* 手动俯仰上限 ≈86°，再往上极点标签就贴到球心 */
var CAM_DUR = 0.45;           /* 预设切换的过渡时长，s */
var CAM_PRESETS = {
  free: { yaw: 0,    tilt: 0.34, zoom: 1 },
  eq:   { yaw: null, tilt: 1.50, zoom: 1 },   /* null = 保留当前偏航，只抬到北极上方 */
  mer:  { yaw: LAM0,  tilt: 0,   zoom: 1 }    /* 视线垂直于探测点所在子午面 ⇒ 该面正对屏幕成圆盘 */
};
var camAnim = null, curPreset = 'free';

/* 截面模式：赤道截面 / 经线截面。此时地球与场停转，且只显示截面内的场 */
function secMode(){ return curPreset === 'eq' || curPreset === 'mer'; }
/* 截面视角下自转被强制停止 —— 按钮置灰，避免「点了没动静」的困惑；
   赤道截面下纬度也被锁在 0（探测点必须待在赤道面上），纬度滑块一并置灰 */
function syncSpinUI(){
  var lock = secMode(), b = $('btnAuto');
  /* 文案跟「地球此刻是否真在转」走，而不是跟用户存下的偏好走 ——
     截面视角下强制停转，此时按钮若还写「停止自转」就是自相矛盾（虽然它已置灰）。 */
  var running = spinOn && !lock;
  if (b){
    b.disabled = lock;
    b.textContent = running ? '停止自转' : '地球自转';
    b.setAttribute('aria-pressed', running ? 'true' : 'false');
    b.title = lock ? '截面视角下地球与场已停转（切回自由视角可再开启）'
                   : (running ? '点击停止自转 · 60 s/周' : '点击开始自转 · 60 s/周');
  }
  var eqLock = (curPreset === 'eq'), sp = $('sPhi'), row = $('rowPhi');
  if (sp) sp.disabled = eqLock;
  if (row){
    if (eqLock) row.classList.add('lock'); else row.classList.remove('lock');
    row.title = eqLock ? '赤道截面下探测点固定在赤道面上' : '';
  }
}

function paintPreset(id){
  var ids = { free:'btnReset', eq:'btnEq', mer:'btnMer' };
  for (var k in ids){
    var el = $(ids[k]);
    if (!el) continue;
    var on = (k === id);
    if (on) el.classList.add('on'); else el.classList.remove('on');
    el.setAttribute('aria-pressed', on ? 'true' : 'false');
  }
  syncSpinUI();
}
function startCam(id){
  var PSET = CAM_PRESETS[id]; if (!PSET) return;
  curPreset = id; paintPreset(id);
  /* 赤道截面看的是赤道面：探测点若不在赤道面上，红色箭头会斜插出剖面、破坏「只有截面内容」的画面。
     直接把纬度归零，让它落回截面内（高度保留），读数与箭头都变得可对照。 */
  if (id === 'eq' && probe.phi !== 0){
    probe.phi = 0; syncSliders();
  }
  /* 偏航走近路：VV.yaw 是无限累加的，先折算成目标附近的等价角，保证 |Δ|≤π */
  var ty = (PSET.yaw == null) ? VV.yaw : PSET.yaw + TWO_PI * Math.round((VV.yaw - PSET.yaw) / TWO_PI);
  var dy = ty - VV.yaw, dtl = PSET.tilt - VV.tilt, dz = PSET.zoom - VV.zoom;
  if (Math.abs(dy) < 1e-3 && Math.abs(dtl) < 1e-3 && Math.abs(dz) < 1e-3){
    camAnim = null;
    VV.yaw = ty; VV.tilt = PSET.tilt; VV.zoom = PSET.zoom; layout();
    return;                                   /* 已在目标位：不做 0.45 s 空动画 */
  }
  camAnim = { y0:VV.yaw, t0:VV.tilt, z0:VV.zoom, y1:ty, t1:PSET.tilt, z1:PSET.zoom, t:0 };
}
function stepCam(dt){
  if (!camAnim) return;
  var a = camAnim;
  a.t += dt;
  var p = a.t / CAM_DUR; if (p > 1) p = 1;
  var e = (p < 0.5) ? 4*p*p*p : 1 - Math.pow(-2*p + 2, 3) / 2;   /* easeInOutCubic */
  VV.yaw  = a.y0 + (a.y1 - a.y0) * e;
  VV.tilt = a.t0 + (a.t1 - a.t0) * e;
  VV.zoom = a.z0 * Math.pow(a.z1 / a.z0, e);   /* 几何插值：缩放走对数才不会「先慢后快」 */
  layout();
  if (p >= 1) camAnim = null;
}
/* 用户手动改视角：立刻终止过渡并取消预设高亮 */
function camUser(){
  if (camAnim) camAnim = null;
  if (curPreset !== null){ curPreset = null; paintPreset(null); }
}

/* ================= 交互：拖红点 / 拖空白处转视角 / 滚轮缩放 ================= */
function pointerToCanvas(e){
  var rect = cv.getBoundingClientRect();
  return { x: (e.clientX - rect.left) * (W / rect.width), y: (e.clientY - rect.top) * (H / rect.height) };
}
function screenRay(sx, sy){
  var dx = sx - V.cx, dy = sy - V.cy;
  return { o: v3(0, 0, CAM), d: v3(dx / V.S, -dy / V.S, -CAM) };
}
/* 屏幕点 → 相机空间射线 → 与过原点的给定平面求交，得到世界坐标点 */
function planeHit(sx, sy, nW){
  var ray = screenRay(sx, sy);
  var n = applyCam(nW);
  var den = n.x*ray.d.x + n.y*ray.d.y + n.z*ray.d.z;
  if (Math.abs(den) < 0.08) return null;      /* 视线近乎与该平面平行时求交不稳，放弃 */
  var t = -(n.x*ray.o.x + n.y*ray.o.y + n.z*ray.o.z) / den;
  if (t <= 0) return null;
  var q = unCam(v3(ray.o.x + ray.d.x*t, ray.o.y + ray.d.y*t, ray.o.z + ray.d.z*t));
  /* 按交点到球心的距离判合法，而不是按 t —— 射线 d 的 z 分量就是 −CAM（不是单位向量），
     t 恒在 1 附近，拿 CAM±2.4 去卡会把所有有效交点误杀（曾导致自由视角下拖红点改不了高度）。
     合法交点必落在场景球附近：球面 1R、最外壳 2R、探测点最高 2R。 */
  var rad = Math.sqrt(q.x*q.x + q.y*q.y + q.z*q.z);
  if (rad < 0.80 || rad > 2.90) return null;
  return q;
}
/* 备用求交：与「探测点所在半径的球面」求交 —— 任何视角都不退化。
   俯视 / 经线截面时射线与子午面近乎共面，只能靠它定位：交点 |Q| 恒等于 probeR()，
   所以拖红点只改纬度、不动高度（高度交给滑块）。 */
function sphereHit(sx, sy, rad){
  var ray = screenRay(sx, sy);
  var o = ray.o, d = ray.d;
  var a2 = d.x*d.x + d.y*d.y + d.z*d.z;
  var b = o.x*d.x + o.y*d.y + o.z*d.z;
  var c = o.x*o.x + o.y*o.y + o.z*o.z - rad*rad;
  var disc = b*b - a2*c;
  if (disc < 0) return null;
  var sq = Math.sqrt(disc), t = (-b - sq) / a2;
  if (t <= 0) t = (-b + sq) / a2;
  if (t <= 0) return null;
  return unCam(v3(o.x + d.x*t, o.y + d.y*t, o.z + d.z*t));
}
function setProbeFromPoint(pt){
  /* 探测点始终待在当前观察的那个平面内：
     · 自由 / 经线截面 → 自己的子午面（法向 = ŷ × (cos λ0, 0, sin λ0)）
     · 赤道截面   → 赤道面（法向 = ŷ），于是纬度锁在 0，拖红点只改高度 */
  var nW = (curPreset === 'eq') ? v3(0, 1, 0) : v3(Math.sin(LAM0), 0, -Math.cos(LAM0));
  var q = planeHit(pt.x, pt.y, nW) || sphereHit(pt.x, pt.y, probeR());
  if (!q) return;
  var rr = Math.sqrt(q.x*q.x + q.y*q.y + q.z*q.z);
  if (rr < 1e-4) return;
  probe.h = clamp(rr - 1, 0, HMAX / RE) * RE;
  probe.phi = clamp(Math.asin(clamp(q.y / rr, -1, 1)) * 180 / Math.PI, -90, 90);
  syncSliders();
}

function probeScreen(){ return P(vmul(probeDir(), probeR())); }
function nearProbe(p){
  var d = probeScreen();
  return Math.sqrt((p.x - d.x)*(p.x - d.x) + (p.y - d.y)*(p.y - d.y)) < 20;
}

var dragMode = null, downP = null, lastP = null, movedFar = false;
cv.style.cursor = 'grab';

cv.addEventListener('pointerdown', function(e){
  var p = pointerToCanvas(e);
  dragMode = nearProbe(p) ? 'probe' : 'orbit';
  downP = p; lastP = p; movedFar = false;
  try{ cv.setPointerCapture(e.pointerId); }catch(err){}
  cv.style.cursor = 'grabbing';
  e.preventDefault();
});
cv.addEventListener('pointermove', function(e){
  var p = pointerToCanvas(e);
  if (!dragMode){ cv.style.cursor = nearProbe(p) ? 'pointer' : 'grab'; return; }
  if (!movedFar && Math.abs(p.x - downP.x) + Math.abs(p.y - downP.y) > 5) movedFar = true;
  if (dragMode === 'probe'){
    setProbeFromPoint(p);
  } else if (movedFar){
    camUser();                                   /* 用户接管视角：终止过渡、取消预设高亮 */
    VV.yaw += (p.x - lastP.x) * 0.0075;
    VV.tilt = clamp(VV.tilt + (p.y - lastP.y) * 0.006, -TILT_LIM, TILT_LIM);
    layout();
  }
  lastP = p;
  e.preventDefault();
});
function endDrag(){
  /* 空白处单击（没拖动）= 把探测点放到该处 */
  if (dragMode === 'orbit' && !movedFar && downP) setProbeFromPoint(downP);
  dragMode = null; downP = null;
  cv.style.cursor = 'grab';
}
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', endDrag);

cv.addEventListener('wheel', function(e){
  if (!e.deltaY) return;
  e.preventDefault();
  camUser();
  VV.zoom = clamp(VV.zoom * Math.exp(-e.deltaY * 0.0013), 0.6, 3.6);
  layout();
}, { passive: false });

$('btnReset').addEventListener('click', function(){ startCam('free'); });
$('btnEq').addEventListener('click', function(){ startCam('eq'); });
$('btnMer').addEventListener('click', function(){ startCam('mer'); });

$('sH').addEventListener('input', function(){
  probe.h = this.value / 1000 * HMAX;
  setTxt('vH', km(probe.h / 1000));
});
$('sPhi').addEventListener('input', function(){
  probe.phi = parseFloat(this.value);
  setTxt('vPhi', probe.phi.toFixed(0));
});
/* 自转开关：在转时显示「停止自转」，停下来显示「地球自转」。
   截面视角下按钮被 syncSpinUI() 置灰（剖面要静静对着看，转起来反而看不清）。 */
$('btnAuto').addEventListener('click', function(){
  spinOn = !spinOn; syncSpinUI();
});
$('themeBtn').addEventListener('click', function(){
  setTheme(!document.body.classList.contains('light'));
});

/* ===== 页头「全屏 / 退出全屏」 =====
   对整页 documentElement 生效。全屏会改变 innerHeight 与画布可用宽度，
   必须调用本页自己的尺寸函数重算；过渡动画期间 innerHeight 可能晚一帧更新，
   故 rAF 与 260ms 各量一次。 */
var RS = onResize;
var fsBtn = $('fsBtn');

function fsIsOn(){
  return !!(document.fullscreenElement || document.webkitFullscreenElement);
}
function fsSync(){
  if (!fsBtn) return;
  var on = fsIsOn(), lb = fsBtn.querySelector('.lbl');
  if (lb) lb.textContent = on ? '退出全屏' : '全屏';
  fsBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
  fsBtn.title = on ? '退出全屏（Esc 也可退出）' : '全屏显示';
}
function fsReflow(){
  requestAnimationFrame(function(){ RS(); setTimeout(RS, 260); });
}
function fsToggle(){
  try{
    if (!fsIsOn()){
      var el = document.documentElement;
      var req = el.requestFullscreen || el.webkitRequestFullscreen;
      if (!req) return;
      var p = req.call(el);
      if (p && p.catch) p.catch(function(){});
    } else {
      var ex = document.exitFullscreen || document.webkitExitFullscreen;
      if (!ex) return;
      var q = ex.call(document);
      if (q && q.catch) q.catch(function(){});
    }
  }catch(e){}
}
if (fsBtn){
  var fsOK = !!(document.fullscreenEnabled || document.webkitFullscreenEnabled) &&
             !!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen);
  if (!fsOK){
    fsBtn.hidden = true;      /* 宿主未给 allow="fullscreen" 时优雅降级，不留死按钮 */
  } else {
    fsBtn.addEventListener('click', fsToggle);
    document.addEventListener('fullscreenchange', function(){ fsSync(); fsReflow(); });
    document.addEventListener('webkitfullscreenchange', function(){ fsSync(); fsReflow(); });
    fsSync();
  }
}

/* ================= 署名行 ================= */
(function(){
  var parts = [AUTHOR_CFG.author];
  if (AUTHOR_CFG.org) parts.push(AUTHOR_CFG.org);
  parts.push(AUTHOR_CFG.version);
  for (var i = 0; i < parts.length; i++){
    if (i){
      var sep = document.createElement('span');
      sep.className = 'sep'; sep.textContent = '·';
      footEl.appendChild(sep);
    }
    var sp = document.createElement('span');
    sp.textContent = parts[i];
    footEl.appendChild(sp);
  }
})();

/* ================= 主循环 ================= */
var lastT = 0;
function tick(t){
  var dt = lastT ? Math.min(0.05, (t - lastT) / 1000) : 0;
  if (!isFinite(dt) || dt < 0) dt = 0;
  lastT = t;
  stepCam(dt);                                      /* 视角预设的过渡（内含 layout） */
  /* 赤道截面下纬度恒为 0：探测点必须待在赤道面上，否则红色箭头会斜插出剖面 */
  if (curPreset === 'eq' && probe.phi !== 0){ probe.phi = 0; syncSliders(); }
  /* 截面视角下地球与场都停转：剖面要能静静对着看，转起来反而看不清截面内的分布 */
  if (spinOn && !secMode()){
    spinAng -= dt * 2 * Math.PI / SPIN_PERIOD;      /* 自西向东：正面看陆地向右移 */
    if (spinAng < -Math.PI * 2) spinAng += Math.PI * 2;
  }
  render();
  requestAnimationFrame(tick);
}

/* ================= 尺寸自适应 ================= */
function onResize(){
  applySize();
  fitViewport();
}
window.addEventListener('resize', function(){ onResize(); });
if (typeof ResizeObserver !== 'undefined'){
  var roLastW = 0;
  new ResizeObserver(function(){
    var w = cv.clientWidth;
    if (Math.abs(w - roLastW) > 1){ roLastW = w; onResize(); }
  }).observe(stageEl);
}

/* ================= 公式渲染 =================
   KaTeX 优先（真 LaTeX 排版）；如果 katex/ 目录不在、或只有 JS 没有 CSS/字体，
   就退回 .mfb 那套 CSS 手排分式 —— 保证「只拷走这一个 .html」也不会退化成一行的纯文本。 */
function katexCssReady(){
  try{
    var p = document.createElement('span');
    p.className = 'katex';
    p.style.cssText = 'position:absolute;left:-9999px;top:0;visibility:hidden;';
    document.body.appendChild(p);
    var fam = getComputedStyle(p).fontFamily || '';
    document.body.removeChild(p);
    return fam.indexOf('KaTeX') >= 0;        /* katex.min.css 把 .katex 的字体设成 KaTeX_* */
  }catch(e){ return false; }
}
function renderMath(){
  var els = document.querySelectorAll('.fx[data-tex]');
  if (!els.length) return;
  if (!(window.katex && window.katex.render) || !katexCssReady()) return;   /* 保留 .mfb */
  for (var i = 0; i < els.length; i++){
    var el = els[i];
    if (el.classList.contains('katexed')) continue;
    var tmp = document.createElement('span');
    try{
      /* 先渲染到临时节点：解析失败时不会把已经排好的 .mfb 清掉 */
      window.katex.render(el.getAttribute('data-tex'), tmp,
        { displayMode:false, throwOnError:true, strict:false });
      if (!tmp.querySelector('.katex')) continue;
      while (el.firstChild) el.removeChild(el.firstChild);
      while (tmp.firstChild) el.appendChild(tmp.firstChild);
      el.classList.add('katexed');
    }catch(e){ el.classList.remove('katexed'); }
  }
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', renderMath);
else renderMath();
window.addEventListener('load', function(){
  renderMath();
  applySize();
  requestAnimationFrame(function(){ applySize(); fitViewport(); });
});

/* ================= 启动 ================= */
/* 主题：head 里那段脚本执行时 <body> 还不存在，class 根本加不上 —— 真正的恢复放在这里。
   另外挂一个 storage 监听：站点与动画同源时，本站切换深浅色会同步到这里。 */
function applyTheme(light){
  document.body.classList.toggle('light', light);
  PAL = light ? THEMES.light : THEMES.dark;
  var b = $('themeBtn');
  if (b) b.textContent = light ? '☀️ 浅色模式' : '🌙 深色模式';  /* 显示当前模式，与站点顶栏一致 */
}

  try{ t = localStorage.getItem('hm_theme'); }catch(e){}
  if (t === 'light') applyTheme(true);
})();
window.addEventListener('storage', function(e){
  if (!e || e.key !== 'hm_theme') return;
  applyTheme(e.newValue === 'light');
});

applySize();
buildRTable();
syncSliders();
syncSpinUI();
updateReadouts();
requestAnimationFrame(tick);

})();
</script>
