<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>匀变速直线运动 · 追击相遇</title>
<link rel="stylesheet" href="katex/katex.min.css">
<style>
:root{
  --bg1:#0d1526; --bg2:#0a101c;
  --card:#141d2f; --card2:#0f1726; --line:#263349;
  --text:#e8eef8; --text2:#96a7c0; --accent:#4d8dff;
  --btn:#1b2740; --btnline:#2c3a55; --inputbg:#1b2740;
  --badgebg:#16273f; --badgefg:#9cc2ff;
}
body.light{
  --bg1:#eef2f6; --bg2:#e3eaf1;
  --card:#ffffff; --card2:#f7fafc; --line:#dde3ea;
  --text:#202730; --text2:#5b6672; --accent:#185fa5;
  --btn:#ffffff; --btnline:#c9d2dc; --inputbg:#ffffff;
  --badgebg:#e6f1fb; --badgefg:#185fa5;
}
*{box-sizing:border-box}
body{margin:0;padding:14px 18px 18px;
     background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 100%);
     background-attachment:fixed;color:var(--text);
     font:17px/1.5 "Times New Roman",Times,"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,sans-serif}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;max-width:1800px;margin:0 auto 12px}
.titles h1{font-size:26px;margin:0;font-weight:600;letter-spacing:1px}
.titles .sub{margin:2px 0 0;font-size:16px;color:var(--text2)}
#themeBtn,#fsBtn{white-space:nowrap}
/* 右列 = max(390px, 28.15%)：390 由读数卡反推（17px 最坏内容 360 + 卡片 22 + 余量），
   拐点在视口 ≈1436，1101–1436 恒为 390，更宽屏才按比例长 */
.topArea{display:grid;grid-template-columns:minmax(0,1fr) minmax(390px,0.392fr);gap:14px;
         max-width:1800px;margin:0 auto;align-items:stretch}
.colL,.colR{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
canvas{display:block;width:100%;border-radius:8px}
.sceneCard{display:flex;flex-direction:column;flex:1;min-height:0}
/* 画布以 JS 计算的高度为基准（flex-basis:auto 才不会被 0 覆盖），
   若右列更高则继续长高吸收余量 —— 保证两列底部严格对齐 */
.sceneCard canvas{flex:1 1 auto;min-height:360px}
.controls{flex:none}                            /* 按内容自然高度排布，不留拉伸空白 */
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px;font-size:15px}
.bar .tl{flex:1;min-width:160px}
.tLabel{font-size:17px;color:var(--text2);min-width:170px;text-align:right}
.tLabel b{font-variant-numeric:tabular-nums;color:var(--text)}
.btn{padding:5px 12px;border:1px solid var(--btnline);background:var(--btn);border-radius:8px;font-size:16px;cursor:pointer;color:var(--text)}
.btn:hover{border-color:var(--accent)}
.btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.play{background:#E0577F;border-color:#E0577F;color:#fff;font-weight:600}
.btn.play:hover{background:#EA7295;border-color:#EA7295}
.badge{font-size:16px;padding:3px 10px;border-radius:8px;background:var(--badgebg);color:var(--badgefg);font-weight:600}
.controls .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px}
.controls .row:first-child{margin-top:0}
.presetGroup{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.playGroup{margin-left:auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.presetGroup .presetLabel{font-size:16px;color:var(--text2);white-space:nowrap}
.presetGroup .btn{padding:5px 9px}
.carBox{flex:1;min-width:280px;border:1px solid var(--line);border-radius:10px;padding:4px 10px 6px}
.carBox legend{font-size:15px;font-weight:600;padding:0 6px}
.pline{display:flex;gap:8px;align-items:center;font-size:17px;margin:3px 0}
.pline label{min-width:104px;color:var(--text)}
.pline input[type=number]{width:74px;font-size:17px;padding:3px 5px;border:1px solid var(--btnline);border-radius:6px;background:var(--inputbg);color:var(--text)}
.pline input[type=range]{flex:1;min-width:80px}
.pline .unit{color:var(--text2);font-size:17px;min-width:58px}
.chkline{display:flex;gap:6px;align-items:center;font-size:16px;color:var(--text);margin-top:2px}
select{font-size:16px;padding:4px 6px;border:1px solid var(--btnline);border-radius:8px;background:var(--inputbg);color:var(--text)}
input[type=checkbox]{accent-color:var(--accent)}
.graphCard{display:flex;flex-direction:column;flex:1;min-height:190px}
.gTitle{font-size:16px;font-weight:600;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.gTitle .gNote{font-size:15px;font-weight:400;color:var(--text2)}
.graphCard canvas{flex:1;cursor:ew-resize}
.katex{font-size:1.08em}
.foot{max-width:1800px;margin:14px auto 0;text-align:center;font-size:16px;color:var(--text2);
      border-top:1px solid var(--line);padding-top:10px;font-weight:400}
@media (max-width:1100px){
  .topArea{grid-template-columns:1fr}
}
/* 矮视口：只压缩间距，不隐藏任何内容（页面允许滚动） */
@media (max-height:920px){
  .top{margin-bottom:8px}
  .card{padding:8px 10px}
  .foot{margin-top:10px;padding-top:8px}
}

/* ===== 窄屏（手机）自适应：只在小屏生效，桌面端不受影响 ===== */
@media (max-width:760px){
  /* 页头从「左右两端」改成上下堆叠：标题不再被主题按钮挤成两行 */
  .top{flex-direction:column;align-items:flex-start;gap:10px;margin-bottom:10px}
  .titles h1{font-size:21px;letter-spacing:.5px}
  .titles .sub{font-size:14.5px}
  .bar{font-size:14.5px}
  .tLabel{min-width:0;font-size:15px}
  .btn{font-size:15px;padding:7px 12px}
  .gTitle{flex-wrap:wrap;gap:4px}
}
/* 参数行原本是「标签 + 数字框74 + 滑块80 + 单位58」固定宽度，合计约 340px。
   车参数卡两列并排时（≲840px）可用宽度不足，会撑破卡片；这里改为
   标签/数字/单位一行、滑块单独占满下一行，从根本上消除横向溢出。 */
@media (max-width:840px){
  .pline{flex-wrap:wrap;gap:6px}
  .pline label{order:1;min-width:0}
  .pline input[type=number]{order:2;width:66px}
  .pline .unit{order:3;min-width:0}
  .pline input[type=range]{order:4;flex:1 1 100%;min-width:0}
  .carBox{min-width:0}
}
@media (max-width:560px){
  body{padding:12px 12px 14px}
  .card{padding:9px 11px}
  .pline label,.pline input[type=number],.pline .unit{font-size:16px}
  .foot{font-size:14px}
}

/* ===== 页头右侧按钮组：主题 + 全屏 =====
   flex:0 0 auto + nowrap：整组不缩不拆行；stretch 让两按钮等高；
   [hidden] 必须显式覆盖：作者样式的 display 会盖掉 UA 的 [hidden]{display:none} */
.hdr-tools{display:flex;align-items:stretch;gap:8px;flex:0 0 auto;flex-wrap:nowrap;}
.hdr-tools .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;}
.hdr-tools .btn svg{width:16px;height:16px;flex:none;}
.hdr-tools .btn[hidden]{display:none;}
.hdr-tools .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.hdr-tools #fsBtn .ico-in{display:none;}
.hdr-tools #fsBtn[aria-pressed="true"] .ico-out{display:none;}
.hdr-tools #fsBtn[aria-pressed="true"] .ico-in{display:block;}
.hdr-tools #fsBtn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);}
@media (max-width:420px){
  .hdr-tools{gap:6px;}
  .hdr-tools .btn{padding-left:11px;padding-right:11px;}
}
@media (max-width:360px){
  .hdr-tools #fsBtn .lbl{display:none;}
}
</style>
</head>
<body>

<header class="top" id="hdr">
  <div class="titles">
    <h1>匀变速直线运动 · 追击相遇</h1>
    <p class="sub">双小车 · 三参考系切换 · $x$–$t$ / $v$–$t$ 图像同步 · 课堂图像预测</p>
  </div>
  <div class="hdr-tools">
    <button class="btn" id="themeBtn" type="button" title="切换深浅主题">🌙 深色模式</button>
    <button class="btn" id="fsBtn" type="button" aria-pressed="false" title="全屏显示">
      <svg class="ico-out" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <path d="M9 4H5a1 1 0 0 0-1 1v4"/><path d="M15 4h4a1 1 0 0 1 1 1v4"/>
        <path d="M20 15v4a1 1 0 0 1-1 1h-4"/><path d="M4 15v4a1 1 0 0 0 1 1h4"/>
      </svg>
      <svg class="ico-in" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <path d="M4 9V5a1 1 0 0 1 1-1h4"/><path d="M20 9V5a1 1 0 0 0-1-1h-4"/>
        <path d="M15 20h4a1 1 0 0 0 1-1v-4"/><path d="M9 20H5a1 1 0 0 1-1-1v-4"/>
      </svg>
      <span class="lbl">全屏</span>
    </button>
  </div>
</header>

<div class="topArea">
  <!-- ================= 左上：场景 + 控制 ================= -->
  <div class="colL">
    <div class="card sceneCard">
      <canvas id="scene"></canvas>
      <div class="bar" id="sceneBar">
        <span class="badge" id="frameBadge">参考系：地面</span>
        <button class="btn on" id="btnFG">地面</button>
        <button class="btn" id="btnFA">A 车</button>
        <button class="btn" id="btnFB">B 车</button>
        <label class="chkline"><input type="checkbox" id="strobeChk"> 频闪虚影（每 1 s 一个像）</label>
        <button class="btn" id="fitBtn">⤢ 适配视图</button>
        <span style="font-size:16px;color:var(--text2);white-space:nowrap">滚轮缩放 <b id="zoomLabel" style="color:var(--text)">100%</b></span>
        <input type="range" class="tl" id="tl" min="0" max="1000" value="0" step="1">
        <span class="tLabel">$t$ = <b id="tNow">0.0</b> s / <b id="tAll">16.0</b> s</span>
      </div>
    </div>

    <div class="card controls" id="ctrl">
      <div class="row">
        <div class="presetGroup">
          <span class="presetLabel">追击相遇预设：</span>
          <button class="btn" id="q1">情境1 · 加速追匀速</button>
          <button class="btn" id="q2">情境2 · 减速未追上</button>
          <button class="btn" id="q3">情境3 · 二次相遇</button>
        </div>
        <div class="playGroup">
          <button class="btn play" id="playBtn">▶ 播放</button>
          <button class="btn" id="resetBtn">↺ 重置</button>
          <select id="speedSel" title="播放速度（相对正常速度的倍数）">
            <option value="0.25">0.25× 慢放</option>
            <option value="0.5">0.5× 慢放</option>
            <option value="1" selected>1× 正常</option>
            <option value="1.5">1.5× 快放</option>
            <option value="2">2× 快放</option>
          </select>
        </div>
      </div>

      <div class="row" style="align-items:stretch">
        <fieldset class="carBox" id="panelA">
          <legend style="color:var(--accent)">A 车（蓝色）</legend>
          <div class="pline"><label>初位置 $x_0$</label><input type="number" id="ax0" step="1" value="0"><input type="range" id="ax0s" min="-100" max="400" step="1" value="0"><span class="unit">$\text{m}$</span></div>
          <div class="pline"><label>初速度 $v_0$</label><input type="number" id="av0" step="0.5" min="-50" max="50" value="0"><input type="range" id="av0s" min="-50" max="50" step="0.5" value="0"><span class="unit">$\text{m/s}$</span></div>
          <div class="pline"><label>加速度 $a$</label><input type="number" id="aa" step="0.1" min="-10" max="10" value="2"><input type="range" id="aas" min="-10" max="10" step="0.1" value="2"><span class="unit">$\text{m/s}^2$</span></div>
          <label class="chkline"><input type="checkbox" id="astop"> 速度减为 0 后停止（刹车模型）</label>
        </fieldset>
        <fieldset class="carBox" id="panelB">
          <legend style="color:#2FBF95">B 车（绿色）</legend>
          <div class="pline"><label>初位置 $x_0$</label><input type="number" id="bx0" step="1" value="40"><input type="range" id="bx0s" min="-100" max="400" step="1" value="40"><span class="unit">$\text{m}$</span></div>
          <div class="pline"><label>初速度 $v_0$</label><input type="number" id="bv0" step="0.5" min="-50" max="50" value="10"><input type="range" id="bv0s" min="-50" max="50" step="0.5" value="10"><span class="unit">$\text{m/s}$</span></div>
          <div class="pline"><label>加速度 $a$</label><input type="number" id="ba" step="0.1" min="-10" max="10" value="0"><input type="range" id="bas" min="-10" max="10" step="0.1" value="0"><span class="unit">$\text{m/s}^2$</span></div>
          <label class="chkline"><input type="checkbox" id="showBChk" checked> 显示 B 车（隐藏后可单独研究 A 车）</label>
          <label class="chkline"><input type="checkbox" id="bstop"> 速度减为 0 后停止（刹车模型）</label>
        </fieldset>
      </div>

      <div class="row">
        <span style="font-size:17px">总时间 $t$</span>
        <input type="number" id="tmax" step="0.5" min="1" max="60" value="16" style="width:74px;font-size:17px;padding:3px 5px;border:1px solid var(--btnline);border-radius:6px;background:var(--inputbg);color:var(--text)">
        <input type="range" id="tmaxs" min="1" max="60" step="0.5" value="16" style="width:120px">
        <span style="font-size:17px">图像对象</span>
        <select id="objSel">
          <option value="A">A 车</option>
          <option value="B">B 车</option>
          <option value="both" selected>A + B 对比</option>
          <option value="mark">路标（地面固定物）</option>
        </select>
        <span style="flex:1"></span>
        <button class="btn" id="predBtn">✎ 手动画图</button>
        <button class="btn" id="clearBtn" title="清空两幅图上的手绘笔迹（任何时候都可用）">清除画笔</button>
        <button class="btn" id="revealBtn">显示图像</button>
      </div>
    </div>
  </div>

  <!-- ================= 右上：两幅图像（v–t 在上、x–t 在下，平分右列高度） ================= -->
  <div class="colR">
    <div class="card graphCard">
      <div class="gTitle"><span>$v$–$t$ 图（速度—时间）</span><span class="gNote" id="vtNote">拖动竖直虚线，小车与图像同步</span></div>
      <canvas id="vt"></canvas>
    </div>
    <div class="card graphCard">
      <div class="gTitle"><span>$x$–$t$ 图（位置—时间）</span><span class="gNote" id="xtNote">在图上左右拖动可同步改变时刻</span></div>
      <canvas id="xt"></canvas>
    </div>
  </div>
</div>

<footer class="foot" id="ftr"><span id="a1"></span>　　<span id="a3"></span></footer>

<script>
(function(){ "use strict";

/* =====AUTHOR_CFG_BEGIN===== */
var ID = { author:'熊和平（大熊印象）', version:'1.0' };
/* =====AUTHOR_CFG_END===== */

var FONT = '"Times New Roman",Times,"PingFang SC","Microsoft YaHei",sans-serif';
/* 数学文字专用字体：优先使用 KaTeX 自带字体，使画布上的物理量与 HTML 区的公式字形统一；
   KaTeX_Main 缺字（如中文）时，自动回退到原来的字体栈（即旧观感），不会出现空白或方框 */
var FONT_MATH = '"KaTeX_Main",' + FONT;
/* 预加载 KaTeX 数学字体，供画布使用（样式表里的 @font-face 此刻已解析完毕） */
(function(){
  if (!document.fonts || !document.fonts.load) return;
  ['20px "KaTeX_Main"', 'italic 20px "KaTeX_Main"',
   '600 20px "KaTeX_Main"', 'italic 600 20px "KaTeX_Main"'].forEach(function(sp){
    try { var p = document.fonts.load(sp); if (p && p.catch) p.catch(function(){}); } catch (e) {}
  });
})();
var TAU = Math.PI * 2;
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function fmt(v,d){ if(!isFinite(v)) v=0; return v.toFixed(d===undefined?1:d); }
function $(id){ return document.getElementById(id); }
function rgba(hex, a){
  var h = hex.replace('#','');
  var r = parseInt(h.substr(0,2),16), g = parseInt(h.substr(2,2),16), b = parseInt(h.substr(4,2),16);
  return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
}

$('a1').textContent = '作者：' + ID.author;
$('a3').textContent = '版本：' + ID.version;

/* ---------------- 主题 ---------------- */
var THEMES = {
  dark: {
    sky:'#152238', sun:'#E8D9A0', sunHalo:'rgba(232,217,160,0.22)',
    cloud:'rgba(205,222,248,0.15)',
    hill:'#23412F', grassBack:'#1C3524', grassFront:'#16301F',
    road:'#2C3947', roadEdge:'#3E4E60', dash:'#5E718A', marker:'#8FA3B8',
    trunk:'#6B4E2E', leaf1:'#2F6B42', leaf2:'#3B7F50',
    flower1:'#8A5570', flower2:'#9A8A4E',
    tipBg:'rgba(8,14,26,0.62)', tipText:'#C9D6E8',
    wheel:'#0A0F16', hub:'#B9C4D4', carLabel:'#FFFFFF',
    vArrow:'#FF7070', vText:'#FF9B9B', aArrow:'#F2A64E', aText:'#FFC98A',
    gBg:'#0F1726', gGrid:'#1C2942', gAxis:'#7E90A8', gTick:'#96A7C0',
    gText:'#D8E2F0',
    A:'#4D8DFF', B:'#2FBF95', mark:'#7E90A8',
    ink:'#9B8CFF', devOk:'#2FBF95', devBad:'#FF7070', hint:'rgba(155,140,255,0.10)',
    tline:'rgba(77,141,255,0.40)',
    edgeBg:'rgba(8,14,26,0.80)', edgeText:'#E8EEF8',
    /* 质感升级新增：sunGlow 太阳柔光（替代硬边 halo 圈）、castY 投影、
       vignette 暗角、gPanel0/1/Edge 图表面板（dark） */
    sunGlow:'rgba(232,217,160,.30)', castY:'rgba(2,8,18,.40)',
    vignette:'rgba(2,8,18,.18)',
    gPanel0:'#121C30', gPanel1:'#0C1424', gPanelEdge:'rgba(150,170,200,.28)',
    hi:'#ffffff', lo:'#000000'
  },
  light: {
    sky:'#DCEDFB', sun:'#FFE9A8', sunHalo:'#FFF4CF',
    cloud:'rgba(255,255,255,0.92)',
    hill:'#CFE6C0', grassBack:'#BFDCA4', grassFront:'#A8CC8E',
    road:'#B8BCB6', roadEdge:'#A7ABA5', dash:'#E8EAED', marker:'#5F6B76',
    trunk:'#8A5A33', leaf1:'#6BA24C', leaf2:'#7FB35B',
    flower1:'#D9708A', flower2:'#F2C14E',
    tipBg:'rgba(255,255,255,0.72)', tipText:'#37414C',
    wheel:'#33383F', hub:'#E8EAED', carLabel:'#FFFFFF',
    vArrow:'#E24B4A', vText:'#A32D2D', aArrow:'#BA7517', aText:'#633806',
    gBg:'#FFFFFF', gGrid:'#EDF1F5', gAxis:'#5F6B76', gTick:'#5F6B76',
    gText:'#37414C',
    A:'#185FA5', B:'#0F6E56', mark:'#8A94A0',
    ink:'#534AB7', devOk:'#0F6E56', devBad:'#E24B4A', hint:'rgba(83,74,183,0.10)',
    tline:'rgba(24,95,165,0.35)',
    edgeBg:'rgba(255,255,255,0.88)', edgeText:'#202730',
    /* 质感升级新增（light：投影/暗角更弱，面板更白） */
    sunGlow:'rgba(255,233,150,.55)', castY:'rgba(40,60,90,.25)',
    vignette:'rgba(40,60,90,.10)',
    gPanel0:'#FFFFFF', gPanel1:'#F2F6FB', gPanelEdge:'rgba(70,90,120,.30)',
    hi:'#ffffff', lo:'#5b6b80'
  }
};
/* 正常速度（1× 档）对应的模拟时间倍率。
   用户 2026-10-26 定：把原来的播放速度整体加快 1.5 倍当作「正常速度」，
   下拉档位 0.25×/0.5×/1×/1.5×/2× 都是相对这个正常速度的倍数，

/* 出画指示牌：y 为牌底部锚点，同侧多块纵向错开 */
function drawEdgeBadge(c, W, y, sxp, name, dist, color){
  var right = sxp > W - 10;
  var text = name + (right ? ' → ' : ' ← ') + dist + ' m';
  /* 牌面是「A 车 → 120 m」这类车辆标签 + 里程，同样用数学字体保持一致
     （KaTeX_Main 的字符表含 ← → 箭头，不会回退） */
  c.font = '18px ' + FONT_MATH;
  var tw = c.measureText(text).width;
  var bw = tw + 24, bh = 28;
  var bx = right ? W - bw - 6 : 6;
  c.fillStyle = PAL.edgeBg;
  rrect(c, bx, y - bh, bw, bh, 6); c.fill();
  c.fillStyle = color; c.fillRect(bx, y - bh, 4, bh);
  c.fillStyle = PAL.edgeText; c.textAlign = 'left'; c.textBaseline = 'middle';
  c.fillText(text, bx + 11, y - bh/2);
}

function drawScene(dt){
  var W = cvS.clientWidth || 900, H = cvS.clientHeight || 420;
  /* 左列被拉高后 backing store 可能滞后：按实际尺寸重设再画，防拉伸/裁切 */
  if (cvS.width !== Math.round(W * dpr) || cvS.height !== Math.round(H * dpr)) sizeCanvas(cvS);
  var c = ctxS;
  c.setTransform(dpr,0,0,dpr,0,0);
  c.clearRect(0,0,W,H);

  var vis = visibleCars();
  var kA = kin(state.cars.A, state.t);
  var kB = kin(state.cars.B, state.t);
  var fk = frameCar() ? kin(frameCar(), state.t) : {x:0,v:0,a:0};

  /* --- 相机：A/B 系锁定对应车；地面系锁死原点，但 A 车逼近画面边缘时自动跟随 --- */
  if (state.frame === 'A') cam = kA.x;
  else if (state.frame === 'B') cam = kB.x;
  else {
    var want = followTarget(W);
    cam = dt > 0 ? cam + (want - cam) * (1 - Math.exp(-dt / FOLLOW_TAU)) : want;
  }

  /* 天空：竖向渐变（顶部深、近地平线略亮），缓存随高度/主题失效 */
  c.fillStyle = vGrad(c, 0, Math.round(H), PAL.sky, mixHex(PAL.sky, PAL.hi, .16));
  c.fillRect(0, 0, W, H);
  drawClouds(c, W, dt);
  /* 太阳：位置/尺寸一个像素不动（已验收）；硬边外圈换成径向柔光 */
  c.drawImage(softSprite(PAL.sunGlow, 72), W-70-72, 66-72, 144, 144);
  c.fillStyle = PAL.sun;
  c.beginPath(); c.arc(W-70, 66, 26, 0, TAU); c.fill();

  drawSceneRoad(c, W, H, kA, kB, fk, vis);

  /* 暗角：压住四角，让画面收拢（深色 α≤.18 / 浅色 α≤.10，走调色板） */
  var vk = W + '|' + H + '|' + state.theme;
  if (!drawScene.__v || drawScene.__v.k !== vk){
    var vg = c.createRadialGradient(W/2, H*0.46, Math.min(W,H)*0.42, W/2, H*0.5, Math.max(W,H)*0.74);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, PAL.vignette);
    drawScene.__v = { k:vk, g:vg };
  }
  c.fillStyle = drawScene.__v.g;
  c.fillRect(0, 0, W, H);
}

function drawSceneRoad(c, W, H, kA, kB, fk, vis){
  var orgX = W * ORGX_RATIO;           /* 坐标原点在动画区左侧 1/5 处 */
  var roadTop = H * 0.57, roadBot = H * 0.84;   /* 路面占 27%H（原 18%）、路下草丛 16%H（原 22%） */
  function sx(wx){ return orgX + (wx - cam) * ppm; }

  c.fillStyle = PAL.hill;
  c.beginPath(); c.ellipse(W*0.22, roadTop+30, 260, 85, 0, Math.PI, 0); c.fill();
  c.beginPath(); c.ellipse(W*0.62, roadTop+30, 320, 62, 0, Math.PI, 0); c.fill();
  c.beginPath(); c.ellipse(W*0.95, roadTop+30, 220, 95, 0, Math.PI, 0); c.fill();

  c.fillStyle = PAL.grassBack;
  c.fillRect(0, roadTop-46, W, 46);
  var i0 = Math.floor((cam - orgX/ppm) / 25) - 1;
  var i1 = Math.ceil((cam + (W-orgX)/ppm) / 25) + 1;
  for (var i = i0; i <= i1; i++){ drawTree(c, sx(treeX(i)), roadTop, treeKind(i), W); }

  /* 路面：竖向渐变（上亮下暗，微弱立体感）；roadEdge 两条边线保留 */
  c.fillStyle = vGrad(c, Math.round(roadTop), Math.round(roadBot),
                      mixHex(PAL.road, PAL.hi, .10), mixHex(PAL.road, PAL.lo, .12));
  c.fillRect(0, roadTop, W, roadBot - roadTop);
  c.fillStyle = PAL.roadEdge; c.fillRect(0, roadTop, W, 3); c.fillRect(0, roadBot-3, W, 3);
  /* 中心虚线：相位锚定世界原点 —— 以车为参考系时随路面一起后退 */
  var dashOn = 26, dashPeriod = 46;
  var yMid = (roadTop + roadBot) / 2;
  var phase = ((sx(0) % dashPeriod) + dashPeriod) % dashPeriod;
  c.strokeStyle = PAL.dash; c.lineWidth = 3;
  for (var dx0 = phase - dashPeriod; dx0 < W + dashPeriod; dx0 += dashPeriod){
    var dx1 = dx0 + dashOn;
    if (dx1 < -5 || dx0 > W + 5) continue;
    c.beginPath(); c.moveTo(dx0, yMid); c.lineTo(dx1, yMid); c.stroke();
  }

  c.fillStyle = PAL.grassFront; c.fillRect(0, roadBot, W, H - roadBot);
  /* 路旁花草：世界坐标锚定（每 ~18 m 簇，随机相位但位置固定） */
  var wL = cam - orgX/ppm, wR = cam + (W - orgX)/ppm;
  var f0 = Math.floor(wL / 18) - 1, f1 = Math.ceil(wR / 18) + 1, fi, fwx, fxp;
  c.fillStyle = PAL.flower1;
  for (fi = f0; fi <= f1; fi++){
    fwx = fi * 18 + (((fi * 2654435761) >>> 0) % 1000) / 1000 * 12;
    fxp = sx(fwx);
    if (fxp < -10 || fxp > W + 10) continue;
    c.beginPath(); c.arc(fxp, roadBot + (H-roadBot)*0.55, 3.2, 0, TAU); c.fill();
  }
  c.fillStyle = PAL.flower2;
  for (fi = f0; fi <= f1; fi++){
    fwx = fi * 23 + 7 + (((fi * 40503) >>> 0) % 1000) / 1000 * 9;
    fxp = sx(fwx);
    if (fxp < -10 || fxp > W + 10) continue;
    c.beginPath(); c.arc(fxp, roadBot + (H-roadBot)*0.72, 3.2, 0, TAU); c.fill();
  }

  /* 里程标（世界坐标，每 50 m） */
  var m0 = Math.floor((cam - orgX/ppm) / 50) * 50;
  var m1 = Math.ceil((cam + (W-orgX)/ppm) / 50) * 50;
  c.font = '17px ' + FONT_MATH; c.textAlign = 'center'; c.textBaseline = 'top';
  for (var m = m0; m <= m1; m += 50){
    var mpx = sx(m);
    if (mpx < -40 || mpx > W + 40) continue;
    c.fillStyle = PAL.marker;
    c.fillRect(mpx-1.5, roadBot-14, 3, 14);
    /* 文字居中会越过画布左右边界被裁掉（窄屏尤其明显）——放不下就整条跳过，
       而不是画一半，否则「150 m」会显示成「15」，反而误导 */
    var mLabel = m + ' m';
    var mHalf = c.measureText(mLabel).width / 2;
    if (mpx - mHalf < 2 || mpx + mHalf > W - 2) continue;
    c.fillText(mLabel, mpx, roadBot + 5);
  }

  /* 两车分置中心虚线两侧（车身竖向范围 sy-27…sy+5，车轮底 = sy+5，中部 = sy-11）：
     · A 车：车轮底正好踩在虚线上 → sy = midY - 5
     · B 车：车身中部正好落在虚线上 → sy = midY + 11 */
  var midY = (roadTop + roadBot) / 2;
  var carYA = midY - 5;
  var carYB = midY + 11;
  function laneY(k){ return k === 'A' ? carYA : carYB; }

  /* 频闪虚影 */
  if (state.strobe){
    for (var gi = 0; gi < state.ghosts.length; gi++){
      var gh = state.ghosts[gi];
      for (var cj = 0; cj < vis.length; cj++){
        var key = vis[cj];
        if (state.frame !== 'ground' && key === state.frame) continue;
        var gpx = sx(gh[key]);
        if (gpx > -50 && gpx < W + 50){
          drawCar(c, gpx, laneY(key), key === 'A' ? PAL.A : PAL.B, '', 0.18);
        }
      }
    }
  }

  /* 小车 + 矢量箭头 */
  var j2, key2, carWX = {};
  for (j2 = 0; j2 < vis.length; j2++){
    key2 = vis[j2];
    var kk = relK(key2 === 'A' ? kA : kB, fk);
    carWX[key2] = (key2 === 'A' ? kA : kB).x;
    var px = sx(carWX[key2]);
    if (px < -100 || px > W + 100) continue;   /* 完全出画的车不再绘制（边缘有指示牌） */
    var col = key2 === 'A' ? PAL.A : PAL.B;
    var carY = laneY(key2);
    /* 车底接触投影：贴路面的扁柔光椭圆（真车才有；频闪虚影不加） */
    c.save();
    c.translate(px, carY + 6);
    c.scale(56/128, 0.14);
    c.drawImage(softSprite(PAL.castY, 64), -64, -64);
    c.restore();
    drawCar(c, px, carY, col, key2, 1);
    /* 只写数值、不画矢量箭头。两车靠得很近，四行标注统一排到两车上方：
       A（靠上）：a 行 carY-126、v 行 carY-98；B（靠下）：a 行 carY-86、v 行 carY-58。
       行距 28px，自下而上依次 B 的 v、B 的 a、A 的 v、A 的 a，两车重合时也不叠字。 */
    c.textBaseline = 'bottom';
    var isA = (key2 === 'A');
    var yV = carY - (isA ? 98 : 58);      /* v 行 */
    var yA = carY - (isA ? 126 : 86);     /* a 行（始终在 v 上方） */
    drawSeg(c, px, yV,
      [{t:'v', i:1, s:20, c:PAL.vText},
       {t:' = ' + (Math.abs(kk.v) < 0.05 ? '0' : fmt(kk.v)) + ' m/s', s:20, c:PAL.vText}], 'center');
    drawSeg(c, px, yA,
      [{t:'a', i:1, s:20, c:PAL.aText},
       {t:' = ' + (Math.abs(kk.a) < 0.05 ? '0' : fmt(kk.a)) + ' m/s', s:20, c:PAL.aText},
       {t:'2', s:14, dy:8, c:PAL.aText}], 'center');
  }

  /* 出画指示牌：同侧多块纵向错开，避免互相遮挡 */
  var badgesL = 0, badgesR = 0;
  for (j2 = 0; j2 < vis.length; j2++){
    key2 = vis[j2];
    var sxp = sx(carWX[key2]);
    if (sxp < 10 || sxp > W - 10){
      var right = sxp > W - 10;
      var idx = right ? badgesR++ : badgesL++;
      drawEdgeBadge(c, W, laneY(key2) - 14 - idx * 30, sxp,
        key2 === 'A' ? 'A车' : 'B车',
        Math.round(Math.abs(carWX[key2] - cam)), key2 === 'A' ? PAL.A : PAL.B);
    }
  }

  /* 参考系提示：只标出当前参考系，字号小、贴近顶部 */
  var tip = state.frame === 'ground' ? '地面参考系' :
            state.frame === 'A' ? '以 A 车为参考系' : '以 B 车为参考系';
  c.font = '15px ' + FONT;
  var tw = c.measureText(tip).width;
  c.fillStyle = PAL.tipBg;
  c.fillRect(W - tw - 20, 4, tw + 14, 26);
  c.fillStyle = PAL.tipText; c.textAlign = 'left'; c.textBaseline = 'middle';
  c.fillText(tip, W - tw - 13, 17);
}

/* ---------------- 图像绘制 ---------------- */
var gmap = { xt:null, vt:null };
/* 测试探针：记录两张图本帧画了什么（供无头断言，不参与渲染） */
var dbg = { hint:{ xt:null, vt:null }, dot:{ xt:false, vt:false } };

function niceStep(range, n){
  var raw = range / n, pow = Math.pow(10, Math.floor(Math.log(raw)/Math.LN10));
  var cand = [1, 2, 2.5, 5, 10], i;
  for (i = 0; i < cand.length; i++){ if (cand[i]*pow >= raw) return cand[i]*pow; }
  return 10*pow;
}
function drawGraph(cv, ctx, kind, dt){
  var W = cv.clientWidth || 520, H = cv.clientHeight || 200;
  if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) sizeCanvas(cv);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  /* 图表面板化：圆角面板 + 竖向渐变 + 投影 + 1px 描边；后续坐标全部不变 */
  ctx.save();
  ctx.shadowColor = PAL.castY; ctx.shadowBlur = 8; ctx.shadowOffsetY = 2;
  ctx.fillStyle = vGrad(ctx, 0, Math.round(H), PAL.gPanel0, PAL.gPanel1);
  rrect(ctx, 0, 0, W, H, 10); ctx.fill();
  ctx.restore();
  ctx.strokeStyle = PAL.gPanelEdge; ctx.lineWidth = 1;
  rrect(ctx, 0.5, 0.5, W-1, H-1, 10); ctx.stroke();
  ctx.save(); rrect(ctx, 0, 0, W, H, 10); ctx.clip();

  var pl = 70, pr = 14, pt = 26, pb = 42;
  var pw = W - pl - pr, ph = H - pt - pb;
  var series = seriesList();

  /* 采样定范围 */
  var N = 160, i, k, t;
  var dataLo = 1e18, dataHi = -1e18;
  var data = [];
  for (i = 0; i < series.length; i++){
    var pts = [];
    for (k = 0; k <= N; k++){
      t = state.tMax * k / N;
      var y = seriesY(series[i], kind, t);
      pts.push({t:t, y:y});
      if (y < dataLo) dataLo = y; if (y > dataHi) dataHi = y;
    }
    data.push(pts);
  }
  if (series.length === 0){ dataLo = -1; dataHi = 1; }
  var pad = (dataHi - dataLo) * 0.10 || 1;
  /* 零点放在时间轴上：数据全部非负时，t 轴（y=0）贴绘图区底边 */
  var yLo, yHi;
  if (dataLo >= 0){ yLo = 0; yHi = dataHi + pad; }
  else { yLo = dataLo - pad; yHi = dataHi + pad; }

  var t0 = 0, t1 = state.tMax;
  var gkey = kind === 'x' ? 'xt' : 'vt';
  gmap[gkey] = { pl:pl, pt:pt, pw:pw, ph:ph, t0:t0, t1:t1, y0:yLo, y1:yHi, W:W, H:H };
  dbg.hint[gkey] = null; dbg.dot[gkey] = false;
  function px(tv){ return pl + (tv - t0)/(t1 - t0) * pw; }
  function py(yv){ return pt + ph - (yv - yLo)/(yHi - yLo) * ph; }

  /* 网格与刻度（刻度数字用数学字体，与轴名、HTML 区公式统一） */
  ctx.font = '19px ' + FONT_MATH;
  var ts2 = niceStep(t1 - t0, 6), ys = niceStep(yHi - yLo, 5);
  var tv, yv;
  ctx.strokeStyle = PAL.gGrid; ctx.lineWidth = 1;
  for (tv = Math.ceil(t0/ts2)*ts2; tv <= t1 + 1e-9; tv += ts2){
    ctx.beginPath(); ctx.moveTo(px(tv), pt); ctx.lineTo(px(tv), pt+ph); ctx.stroke();
  }
  for (yv = Math.ceil(yLo/ys)*ys; yv <= yHi + 1e-9; yv += ys){
    ctx.beginPath(); ctx.moveTo(pl, py(yv)); ctx.lineTo(pl+pw, py(yv)); ctx.stroke();
  }
  /* 坐标轴：纵轴在 t=0，横轴（t 轴）过 y=0 零点 */
  ctx.strokeStyle = PAL.gAxis; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(pl, pt); ctx.lineTo(pl, pt+ph); ctx.stroke();
  var y0px = py(0);
  ctx.beginPath(); ctx.moveTo(pl, y0px); ctx.lineTo(pl+pw, y0px); ctx.stroke();
  /* 刻度数字 */
  ctx.fillStyle = PAL.gTick; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  for (tv = Math.ceil(t0/ts2)*ts2; tv <= t1 + 1e-9; tv += ts2){
    ctx.fillText(fmt(tv, ts2 < 1 ? 1 : 0), px(tv), pt+ph+8);
  }
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  for (yv = Math.ceil(yLo/ys)*ys; yv <= yHi + 1e-9; yv += ys){
    if (Math.abs(yv) < ys*0.01) continue;   /* 0 已在轴上，不重复标 */
    ctx.fillText(fmt(yv, ys < 1 ? 1 : 0), pl - 8, py(yv));
  }
  /* 轴名（准 TeX）—— 变量用常规字重，与 HTML 区公式一致，不再加粗 */
  ctx.textBaseline = 'top';
  var segs = kind === 'x'
    ? [{t:'x', i:1, s:19, c:PAL.gText}, {t:' / m', s:19, c:PAL.gText}]
    : [{t:'v', i:1, s:19, c:PAL.gText}, {t:' / (m/s)', s:19, c:PAL.gText}];
  if (state.frame !== 'ground') segs.push({t:'（相对' + frameName() + '）', s:17, c:PAL.gTick});
  ctx.textBaseline = 'bottom';
  drawSeg(ctx, pl + pw, pt + ph - 8, [{t:'t', i:1, s:19, c:PAL.gText}, {t:' / s', s:19, c:PAL.gText}], 'right');
  /* 纵轴名放在纵轴右侧（绘图区内左上方），不再占用轴左侧空间。
     右上角图例占用绘图区最右侧约 68px，空间不足时先自动缩小字号（最小 14px）；
     仍放不下则让「（相对…）」后缀让位 —— 该参考系提示在卡片标题下已标注，不丢信息。 */
  ctx.textBaseline = 'top';
  var nameAvail = pw - 106, nameFs = 19, nq, nw, baseS = [];
  for (nq = 0; nq < segs.length; nq++) baseS[nq] = segs[nq].s || 19;
  for (; nameFs >= 14; nameFs--){
    nw = 0;
    for (nq = 0; nq < segs.length; nq++) segs[nq].s = Math.max(13, Math.round(baseS[nq] * nameFs / 19));
    for (nq = 0; nq < segs.length; nq++){ ctx.font = segFont(segs[nq]); nw += ctx.measureText(segs[nq].t).width; }
    if (nw <= nameAvail || nameFs <= 14) break;
  }
  if (nw > nameAvail && segs.length > 2){
    segs.length = 2;
    segs[0].s = 18; segs[1].s = 18;
  }
  drawSeg(ctx, pl + 10, pt + 4, segs, 'left');

  if (series.length === 0){
    ctx.fillStyle = PAL.mark; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '17px ' + FONT;
    ctx.fillText('该对象当前不可见（B 车已隐藏或不在显示范围），请更换「图像对象」', pl + pw/2, pt + ph/2);
    ctx.restore();   /* 退出面板 clip */
    return;
  }

  /* 真实图线只在「显示图像」时画，而且**只画到当前时刻 state.t**：
     图像必须与两车已经走过的运动一一对应 —— 车还没动就点开是空图（只有坐标轴），
     播放中图线随运动一起向右生长；刚点亮时用 1.2s 把 0→t 这一段扫出来。
     （旧写法是 tMax×扫出进度，等于一按就把整条曲线画完，与运动脱节。） */
  var showTo = -1;
  if (state.revealed && state.t > 0) showTo = state.t * easeReveal();

  /* v–t 面积（单序列时） */
  if (kind === 'v' && data.length === 1 && showTo > 0){
    var ptsA = data[0];
    ctx.fillStyle = rgba(series[0].color, 0.10);
    ctx.beginPath();
    var started = false;
    for (i = 0; i < ptsA.length; i++){
      if (ptsA[i].t > showTo) break;
      var yx = clamp(ptsA[i].y, yLo, yHi);
      if (!started){ ctx.moveTo(px(ptsA[i].t), py(0)); ctx.lineTo(px(ptsA[i].t), py(yx)); started = true; }
      else ctx.lineTo(px(ptsA[i].t), py(yx));
    }
    if (started){ ctx.lineTo(px(Math.min(showTo, t1)), py(0)); ctx.closePath(); ctx.fill(); }
  }

  /* 曲线（先画一遍宽而淡的辉光描边，再叠原线；不用 shadowBlur —— 每帧两条曲线 ×2 图） */
  for (i = 0; i < data.length; i++){
    var pts2 = data[i];
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.strokeStyle = rgba(series[i].color, 0.15); ctx.lineWidth = 6.5;
    ctx.beginPath();
    var pen = false;
    for (k = 0; k < pts2.length; k++){
      if (pts2[k].t > showTo + 1e-9) break;
      var yy = pts2[k].y;
      if (yy < yLo - pad || yy > yHi + pad){ pen = false; continue; }
      var X = px(pts2[k].t), Y = py(yy);
      if (!pen){ ctx.moveTo(X, Y); pen = true; } else ctx.lineTo(X, Y);
    }
    ctx.stroke();
    ctx.strokeStyle = series[i].color; ctx.lineWidth = 2.5;
    ctx.stroke();
    /* 圆点只在「图像已显示」且扫出动画已越过当前时刻时画；
       隐藏图像 / 手动画图时都不该出现孤立圆点 */
    if (state.revealed && state.t > 0 && state.t <= showTo + 1e-9){
      var cy2 = seriesY(series[i], kind, state.t);
      if (cy2 >= yLo && cy2 <= yHi){
        ctx.fillStyle = series[i].color;
        ctx.beginPath(); ctx.arc(px(state.t), py(cy2), 5, 0, TAU); ctx.fill();
        if (typeof dbg !== 'undefined') dbg.dot[gkey] = true;
      }
    }
  }

  /* 当前时刻竖直虚线（可在图上左右拖动） */
  /* 当前时刻竖直虚线：一直画，手动画图时也作为时间参照 */
  ctx.strokeStyle = PAL.tline; ctx.lineWidth = 1.5; ctx.setLineDash([6,5]);
  ctx.beginPath(); ctx.moveTo(px(state.t), pt); ctx.lineTo(px(state.t), pt+ph); ctx.stroke();
  ctx.setLineDash([]);

  /* 徒手笔画 */
  var stks = strokes[gkey];
  for (i = 0; i < stks.length; i++){
    var st = stks[i];
    /* 判分着色只看「显示图像」后是否算过误差，不再要求仍处于画图模式 */
    if (state.revealed && st.ok !== undefined){
      for (k = 1; k < st.pts.length; k++){
        ctx.strokeStyle = st.ok[k] ? PAL.devOk : PAL.devBad;
        ctx.lineWidth = 3.5; ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(px(st.pts[k-1].u * t1), py(st.pts[k-1].w * (yHi-yLo) + yLo));
        ctx.lineTo(px(st.pts[k].u * t1), py(st.pts[k].w * (yHi-yLo) + yLo));
        ctx.stroke();
      }
    } else {
      ctx.strokeStyle = PAL.ink; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
      ctx.beginPath();
      for (k = 0; k < st.pts.length; k++){
        var X2 = px(st.pts[k].u * t1), Y2 = py(st.pts[k].w * (yHi-yLo) + yLo);
        if (k === 0) ctx.moveTo(X2, Y2); else ctx.lineTo(X2, Y2);
      }
      ctx.stroke();
    }
  }

  /* 图例 */
  var lx = pl + pw - 10;
  ctx.font = '18px ' + FONT; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  for (i = series.length - 1; i >= 0; i--){
    ctx.fillStyle = series[i].color;
    ctx.fillRect(lx - 58, pt + 8 + i*18, 12, 12);
    ctx.fillStyle = PAL.gText;
    ctx.fillText(series[i].name, lx, pt + 14 + i*18);
  }
  /* 空图提示
     · 手动画图：半透明遮罩 + 两行指引（27 字一行在 pw≈280 时即使 11px 也放不下，必须拆行）
     · 仅隐藏图像：只写一行浅色说明，不加遮罩，免得盖住网格与刻度 */
  if (state.predict || !state.revealed || state.t <= 0){
    var hLines = state.predict
      ? ['请用鼠标在此画出你预测的图线', '再点「显示图像」对比']
      : (!state.revealed
          ? ['图像已隐藏，点「显示图像」查看']
          : ['尚未开始运动，图线将随运动向右生长']);
    var hWeight = state.predict ? '600 ' : '';
    var hfs = state.predict ? 17 : 15, hj, hw;
    for (; hfs > 12; hfs--){
      ctx.font = hWeight + hfs + 'px ' + FONT;
      hw = 0;
      for (hj = 0; hj < hLines.length; hj++) hw = Math.max(hw, ctx.measureText(hLines[hj]).width);
      if (hw <= pw - 20) break;
    }
    hfs = Math.max(hfs, 12);
    ctx.font = hWeight + hfs + 'px ' + FONT;
    if (state.predict){
      ctx.fillStyle = PAL.hint; ctx.fillRect(pl, pt, pw, ph);
      ctx.fillStyle = PAL.ink;
    } else {
      ctx.fillStyle = PAL.gTick;
    }
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    var hLh = Math.round(hfs * 1.45);
    var hy0 = pt + ph/2 - (hLines.length - 1) * hLh / 2;
    for (hj = 0; hj < hLines.length; hj++) ctx.fillText(hLines[hj], pl + pw/2, hy0 + hj * hLh);
    if (typeof dbg !== 'undefined') dbg.hint[gkey] = state.predict ? 'predict' : 'empty';
  } else if (typeof dbg !== 'undefined'){
    dbg.hint[gkey] = null;
  }
  ctx.restore();   /* 退出面板 clip */
}
function easeReveal(){
  var el = (performance.now() - state.revealStart) / 1200;
  if (el >= 1){ state.revealT = 1; return 1; }
  state.revealT = el;
  return el;
}
function computeDev(kind){
  var key = kind === 'x' ? 'xt' : 'vt';
  var stks = strokes[key];
  var series = seriesList();
  if (series.length === 0 || !gmap[key] || !stks) return;
  var m = gmap[key];
  for (var si = 0; si < stks.length; si++){
    var st = stks[si];
    st.ok = [];
    for (var pi = 0; pi < st.pts.length; pi++){
      var t = st.pts[pi].u * m.t1;
      var wTrue = (seriesY(series[0], kind, t) - m.y0) / (m.y1 - m.y0);
      var dPx = Math.abs(st.pts[pi].w - wTrue) * m.ph;
      st.ok[pi] = dPx <= Math.max(7, m.ph * 0.05);
    }
  }
}

/* ---------------- 读数面板 ---------------- */
function updateReadout(){
  $('tNow').textContent = fmt(state.t);
  $('tAll').textContent = fmt(state.tMax);
  $('zoomLabel').textContent = Math.round(ppm / (fitPpm || ppm) * 100) + '%';
  $('frameBadge').textContent = '参考系：' + frameName();
  var note = state.frame === 'ground' ? '' : '（相对' + frameName() + '）';
  $('xtNote').textContent = note === '' ? '在图上左右拖动可同步改变时刻' : '在图上拖动虚线同步改变时刻' + note;
  $('vtNote').textContent = $('xtNote').textContent;
}

/* ---------------- 交互绑定 ---------------- */
function clearGhosts(){ state.ghosts = []; }
  function paramChanged(){
    state.t = clamp(state.t, 0, state.tMax);
    clearGhosts();
    state.revealed = false; state.revealT = 0;
    syncCurveBtn();          /* 图线已被隐藏，按钮文案同步回「显示图像」 */
    /* 刻意不调用 snapScale：调节初始条件不应改变画面缩放 */
  }
function bindPair(idN, idR, apply){
  var n = $(idN), r = $(idR);
  function fromN(){ var v = parseFloat(n.value); if (isFinite(v)){ r.value = v; apply(v); paramChanged(); } }
  function fromR(){ var v = parseFloat(r.value); n.value = v; apply(v); paramChanged(); }
  n.addEventListener('input', fromN);
  r.addEventListener('input', fromR);
}
bindPair('ax0','ax0s', function(v){ state.cars.A.x0 = v; });
bindPair('av0','av0s', function(v){ state.cars.A.v0 = v; });
bindPair('aa','aas',   function(v){ state.cars.A.a = v; });
bindPair('bx0','bx0s', function(v){ state.cars.B.x0 = v; });
bindPair('bv0','bv0s', function(v){ state.cars.B.v0 = v; });
bindPair('ba','bas',   function(v){ state.cars.B.a = v; });
bindPair('tmax','tmaxs', function(v){ state.tMax = clamp(v, 1, 60); });
$('astop').addEventListener('change', function(){ state.cars.A.stop = this.checked; paramChanged(); });
$('bstop').addEventListener('change', function(){ state.cars.B.stop = this.checked; paramChanged(); });
$('strobeChk').addEventListener('change', function(){ state.strobe = this.checked; });

/* 动画区滚轮缩放 + 适配视图 */
$('fitBtn').addEventListener('click', function(){ snapScale(); });
cvS.addEventListener('wheel', function(e){
  zoomBy(e.deltaY < 0 ? 1.12 : 1 / 1.12);
  if (e.preventDefault) e.preventDefault();
}, { passive: false });

/* B 车显示 / 隐藏（不改变缩放） */
$('showBChk').addEventListener('change', function(){
  state.showB = this.checked;
  $('btnFB').disabled = !state.showB;
  if (!state.showB && state.frame === 'B') setFrame('ground');
  clearGhosts();
});

$('playBtn').addEventListener('click', togglePlay);
$('resetBtn').addEventListener('click', doReset);
$('speedSel').addEventListener('change', function(){
  speedGear = parseFloat(this.value) || 1;
  state.speed = SPEED_BASE * speedGear;   /* 档位是相对「正常速度」的倍数 */
});

function togglePlay(){
  if (state.t >= state.tMax) state.t = 0;
  state.playing = !state.playing;
  $('playBtn').textContent = state.playing ? '⏸ 暂停' : '▶ 播放';
}
function doReset(){
  state.playing = false; state.t = 0;
  $('playBtn').textContent = '▶ 播放';
  clearGhosts();
  resetCam();
}

/* 参考系切换 */
function setFrame(f){
  if (f === 'B' && !state.showB) return;
  state.frame = f;
  $('btnFG').classList.toggle('on', f === 'ground');
  $('btnFA').classList.toggle('on', f === 'A');
  $('btnFB').classList.toggle('on', f === 'B');
  resetCam();                          /* 换视角时镜头回到该参考系的默认位置 */
}
$('btnFG').addEventListener('click', function(){ setFrame('ground'); });
$('btnFA').addEventListener('click', function(){ setFrame('A'); });
$('btnFB').addEventListener('click', function(){ setFrame('B'); });

/* 时间轴 */
$('tl').addEventListener('input', function(){
  state.t = (parseFloat(this.value) / 1000) * state.tMax;
});

/* 追击相遇预设 */
function syncInputs(){
  var A = state.cars.A, B = state.cars.B;
  $('ax0').value = A.x0; $('ax0s').value = A.x0;
  $('av0').value = A.v0; $('av0s').value = A.v0;
  $('aa').value = A.a;   $('aas').value = A.a;
  $('astop').checked = A.stop;
  $('bx0').value = B.x0; $('bx0s').value = B.x0;
  $('bv0').value = B.v0; $('bv0s').value = B.v0;
  $('ba').value = B.a;   $('bas').value = B.a;
  $('bstop').checked = B.stop;
  $('tmax').value = state.tMax; $('tmaxs').value = state.tMax;
}
var PRESETS = [
  { name:'情境1 · 加速追匀速',  A:{x0:0, v0:0,  a:2,  stop:false}, B:{x0:40, v0:10, a:0, stop:false}, tMax:16 },
  { name:'情境2 · 减速未追上',  A:{x0:0, v0:20, a:-2, stop:true }, B:{x0:50, v0:10, a:0, stop:false}, tMax:12 },
  { name:'情境3 · 二次相遇',    A:{x0:0, v0:30, a:-3, stop:true }, B:{x0:30, v0:10, a:0, stop:false}, tMax:14 }
];
function applyPreset(idx){
  var p = PRESETS[idx];
  state.preset = idx;
  var A = state.cars.A, B = state.cars.B;
  A.x0 = p.A.x0; A.v0 = p.A.v0; A.a = p.A.a; A.stop = p.A.stop;
  B.x0 = p.B.x0; B.v0 = p.B.v0; B.a = p.B.a; B.stop = p.B.stop;
  state.tMax = p.tMax;
  state.t = 0; state.playing = false; $('playBtn').textContent = '▶ 播放';
  state.ghosts = [];
  strokes.xt = []; strokes.vt = [];
  state.objBeforePredict = null;               /* 换情境后重新记录，避免沿上一情境的对象 */
  state.graphObj = 'both'; $('objSel').value = 'both';
  zoomBoost = (idx === 0) ? 1.5 : 1;           /* 情境1 用 150% 作为基准视图，其余情境保持适配视图 */
  setFrame('ground');
  syncInputs();
  snapScale();
  state.predict = false;                       /* 先清标志，下面的 setPredict 才会真正执行 */
  setPredict(false);                           /* 与页面默认态一致：不进入手动画图 */
  setCurves(false);                            /* 图线隐藏，按钮文案回到「显示图像」 */
}
$('q1').addEventListener('click', function(){ applyPreset(0); });
$('q2').addEventListener('click', function(){ applyPreset(1); });
$('q3').addEventListener('click', function(){ applyPreset(2); });

/* ===== 手动画图 / 显示图像 =====
   两个独立动作：
   · 「✎ 手动画图」→ 进入画图模式：藏起真实图线、允许在图上画预测线（播放不受影响）；
   · 「显示图像 / 隐藏图像」→ 切换真实图线，并一律退出手动画图模式。
   页面默认进入手动画图模式（见文件末尾启动序列）。 */
function syncCurveBtn(){
  var b = $('revealBtn');
  if (b) b.textContent = state.revealed ? '隐藏图像' : '显示图像';
}
function setCurves(show){
  state.revealed = !!show;
  state.revealStart = performance.now();      /* 从头扫出（1.2 s） */
  state.revealT = 0;
  syncCurveBtn();
}
function setPredict(on){
  if (on && state.predict) return;            /* 已在画图中：不重复进入 */
  state.predict = !!on;
  var pb = $('predBtn');
  pb.classList.toggle('on', state.predict);
  if (state.predict){
    if (!state.objBeforePredict) state.objBeforePredict = state.graphObj;   /* 记住进入前的图像对象 */
    if (state.graphObj === 'both'){ $('objSel').value = 'A'; state.graphObj = 'A'; }
    strokes.xt = []; strokes.vt = [];         /* 每轮重新画 */
    setCurves(false);                         /* 画图时先藏起图像 */
  } else {
    if (state.objBeforePredict){              /* 退出时恢复原来的图像对象 */
      state.graphObj = state.objBeforePredict;
      $('objSel').value = state.objBeforePredict;
      state.objBeforePredict = null;
    }
    syncCurveBtn();
  }
}
$('predBtn').addEventListener('click', function(){ setPredict(true); });
$('clearBtn').addEventListener('click', function(){
  strokes.xt = []; strokes.vt = [];           /* 只清笔迹，不动图像显隐 */
});
$('revealBtn').addEventListener('click', function(){
  var next = !state.revealed;
  if (state.predict) setPredict(false);       /* 点显示/隐藏图像 → 先退出手动画图 */
  if (next){ computeDev('x'); computeDev('v'); }   /* 用来把学生笔迹判成对/错着色 */
  setCurves(next);
});
$('objSel').addEventListener('change', function(){
  state.graphObj = this.value;
  if (state.graphObj === 'both' && state.predict){
    $('objSel').value = 'A'; state.graphObj = 'A';
  }
  if (state.revealed) state.revealStart = performance.now(), state.revealT = 0;  /* 换对象后重新扫出 */
});

/* 徒手绘制（仅预测模式） */
function strokeNorm(cv, e, kind){
  var m = gmap[kind];
  if (!m) return null;
  var rect = cv.getBoundingClientRect();
  var x = e.clientX - rect.left, y = e.clientY - rect.top;
  var u = clamp((x - m.pl) / m.pw, 0, 1);
  var w = clamp(1 - (y - m.pt) / m.ph, 0, 1);
  return {u:u, w:w};
}
function bindDraw(cv, kind){
  cv.addEventListener('pointerdown', function(e){
    if (!state.predict) return;
    var p = strokeNorm(cv, e, kind);
    if (!p) return;
    drawing = {kind:kind, pts:[p]};
    strokes[kind].push(drawing);
    if (cv.setPointerCapture && e.pointerId !== undefined){
      try { cv.setPointerCapture(e.pointerId); } catch(err){}
    }
    e.preventDefault();
  });
  cv.addEventListener('pointermove', function(e){
    if (!drawing || drawing.kind !== kind) return;
    var p = strokeNorm(cv, e, kind);
    if (p) drawing.pts.push(p);
    e.preventDefault();
  });
  function end(){ drawing = null; }
  cv.addEventListener('pointerup', end);
  cv.addEventListener('pointerleave', end);
}
bindDraw(cvX, 'xt');
bindDraw(cvV, 'vt');

/* 图上拖动竖直虚线 → 同步时刻（小车、两图、时间轴联动） */
function bindCursor(cv){
  var dragging = false;
  function setT(e){
    var m = (cv === cvX) ? gmap.xt : gmap.vt;
    if (!m) return;
    var rect = cv.getBoundingClientRect();
    var u = clamp((e.clientX - rect.left - m.pl) / m.pw, 0, 1);
    state.t = u * state.tMax;
  }
  cv.addEventListener('pointerdown', function(e){
    if (state.predict) return;          /* 预测模式下画笔优先 */
    dragging = true;
    setT(e);
    if (cv.setPointerCapture && e.pointerId !== undefined){
      try { cv.setPointerCapture(e.pointerId); } catch(err){}
    }
    e.preventDefault();
  });
  cv.addEventListener('pointermove', function(e){
    if (!dragging) return;
    setT(e);
    e.preventDefault();
  });
  function end(){ dragging = false; }
  cv.addEventListener('pointerup', end);
  cv.addEventListener('pointercancel', end);
}
bindCursor(cvX);
bindCursor(cvV);

/* 空格播放/暂停 */
if (typeof document !== 'undefined' && document.addEventListener){
  document.addEventListener('keydown', function(e){
    var tag = (e.target && e.target.tagName) || '';
    if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
    if (e.code === 'Space'){ togglePlay(); e.preventDefault(); }
  });
}

/* ---------------- 主循环 ---------------- */
/* 各情境的自动停止条件：
   情境1 —— 不设停止条件：相遇（重合）后两车继续运动，把「追上 → 并排 → 超越」全过程都看到，
             播到总时间结束自然停住；
   情境2 —— A 车速度减到 0（刹车模型停住）；
   情境3 —— 不设条件，播到总时间结束。 */
function stopHit(t){
  var A = state.cars.A;
  if (state.preset === 1) return t > 0 && kin(A, t).v <= 0;
  return false;
}
function stepOnce(dt){
  if (state.playing){
    var prev = state.t;
    state.t = Math.min(state.tMax, state.t + dt * state.speed);
    /* 越过停止条件的第 1 帧：二分到毫米级，把时间定格在相遇/停住那一刻 */
    if (!stopHit(prev) && stopHit(state.t)){
      var lo = prev, hi = state.t, mid, bi;
      for (bi = 0; bi < 24; bi++){
        mid = (lo + hi) / 2;
        if (stopHit(mid)) hi = mid; else lo = mid;
      }
      state.t = hi;
      state.playing = false;
      var pbStop = $('playBtn'); if (pbStop) pbStop.textContent = '▶ 播放';
    }
    if (state.strobe && !state.predict){
      var k0 = Math.floor(prev) + 1, k1 = Math.floor(state.t);
      for (var k = k0; k <= k1; k++){
        state.ghosts.push({t:k, A:kin(state.cars.A, k).x,
                           B: state.showB ? kin(state.cars.B, k).x : undefined});
      }
      if (state.ghosts.length > 80) state.ghosts.splice(0, state.ghosts.length - 80);
    }
    if (state.t >= state.tMax){
      state.playing = false;
      var pb = $('playBtn'); if (pb) pb.textContent = '▶ 播放';
    }
  }
}
function drawAll(dt){
  drawScene(dt);
  drawGraph(cvX, ctxX, 'x', dt);
  drawGraph(cvV, ctxV, 'v', dt);
  updateReadout();
  var tl = $('tl');
  if (tl && document.activeElement !== tl) tl.value = Math.round(state.t / state.tMax * 1000);
}
var lastTs = null;
function frame(ts){
  var dt = 0;
  if (lastTs !== null){ dt = clamp((ts - lastTs) / 1000, 0, 0.05); }
  lastTs = ts;
  stepOnce(dt);
  drawAll(dt);
  requestAnimationFrame(frame);
}

resize();
/* 打开页面就等于「情境1」：参数、总时间 16 s、150% 基准视图、隐藏图像，全部由 applyPreset 统一设置 */
applyPreset(0);
drawAll(0);
requestAnimationFrame(frame);
/* 字体与布局稳定后重算一次动画区高度 */
if (typeof window !== 'undefined' && window.addEventListener){
  window.addEventListener('load', function(){ resize(); });
}

/* 测试钩子（不影响页面） */
if (typeof globalThis !== 'undefined'){
  globalThis.__api = {
    state: state, strokes: strokes, kin: kin, gmap: gmap,
    getDbg: function(){ return dbg; },
    getZoom: function(){ return { ppm:ppm, fitPpm:fitPpm, boost:zoomBoost, cam:cam, orgX:(cvS.clientWidth||0)*ORGX_RATIO }; },
    THEMES: THEMES, getPal: function(){ return PAL; }, setTheme: setTheme,
    getCam: function(){ return cam; }, getPpm: function(){ return ppm; },
    PRESETS: PRESETS, applyPreset: applyPreset,
    stepOnce: stepOnce, drawAll: drawAll,
    setFrame: setFrame, seriesList: seriesList, seriesY: seriesY,
    visibleCars: visibleCars, resize: resize, snapScale: snapScale
  };
}
})();
</script>
<script defer src="katex/katex.min.js"></script>
<script defer src="katex/contrib/auto-render.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function(){
  if (window.renderMathInElement){
    renderMathInElement(document.body, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$', right: '$', display: false}
      ],
      throwOnError: false
    });
  }
});
</script>
</body>
